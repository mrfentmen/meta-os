[package]
name = "assess-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "assess-server"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
queue-store = { path = "../queue-store" }
guardrail = { path = "../guardrail" }
queue-core = { path = "../queue-core" }
agent-runtime = { path = "../agent-runtime" }
