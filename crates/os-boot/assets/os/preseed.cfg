# os/preseed.cfg - Meta OS unattended install answers (OS-009).
#
# Written from the OS-009 spec for the Packer route in plan/META_OS.md:
# single relay user, autologin handled by the systemd drop-in that
# build-image.sh installs (not by the installer), UTC clock, en_US
# locale, one partition plus a swapfile. This file has NOT yet been
# proven by an unattended install run: the image that actually booted
# on 2026-10-26 was built by the debootstrap route (os/build-all.sh
# plus os/build-image.sh), not by this preseed. Do not claim a
# preseed install works until OS-009's acceptance run records one.
# No secrets in this file: the relay account password is locked (*).

# Locale and keyboard
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# Clock: UTC, no hardware-clock prompt
d-i clock-setup/utc boolean true
d-i time/zone string Etc/UTC
d-i clock-setup/ntp boolean true

# Network: DHCP, no hostname prompt (hostname is set to metaos by the
# image build; the installer value here only avoids a prompt)
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string metaos
d-i netcfg/get_domain string local

# Disk: one partition on the first disk, no prompts. The swapfile is
# created by late_command below, not by a swap partition.
d-i partman-auto/method string regular
d-i partman-auto/disk string /dev/vda
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# User: single relay account, password locked (no default password
# anywhere in the image; OS-012). Console autologin is a systemd
# drop-in installed by build-image.sh, not an installer setting.
d-i passwd/user-fullname string relay
d-i passwd/username string relay
d-i passwd/user-password-crypted password *
d-i passwd/user-default-groups string sudo

# Package selection: minimal base only; the package set itself is
# os/packages.txt (pinned by OS-010, not here).
tasksel tasksel/first multiselect standard
d-i pkgsel/include string openssh-server
d-i pkgsel/upgrade select none

# Boot loader on the first disk, no prompt.
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i finish-install/reboot_in_progress note

# Late command: 1G swapfile, fstab entry, and the metaos version stamp
# placeholder (the real stamp is written by build-image.sh at bake time).
d-i preseed/late_command string \
  fallocate -l 1G /target/swapfile; \
  chmod 600 /target/swapfile; \
  echo "/swapfile none swap sw 0 0" >> /target/etc/fstab; \
  in-target systemctl enable serial-getty@ttyS0.service || true
