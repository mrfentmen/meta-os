# demo-thresholds.conf - OS-038 (Milo): demo thresholds profile for
# relay-watchdog.service, DEMO IMAGE ONLY.
#
# Loads intel/metaos-demo.env (DEM-013) through EnvironmentFile, so
# the watchdog on the demo image runs the shortened stall windows
# (1 minute, not the 10-minute production default) with no code
# edit and no change to the production unit file: this drop-in
# sets environment only and deliberately contains no ExecStart,
# so the production command (intel/watchdog.py --loop --room main
# --beat, OS-033) runs exactly as shipped.
#
# Install gate: os/build-image.sh installs this drop-in only when
# METAOS_DEMO=1. A production build (the default) never sees it,
# so production thresholds come from intel/thresholds.py defaults
# alone. The env file path below is the image path: build-image.sh
# rsyncs the whole repo to /opt/relay, so intel/metaos-demo.env
# lands at /opt/relay/intel/metaos-demo.env on every image.
#
# Strict EnvironmentFile (no "-" prefix) on purpose: if the
# profile is missing on a demo image, the unit must fail loudly
# at start rather than silently demoing with 10-minute windows
# while the Shot 8 catch never fires. On a production image
# this file is absent because the drop-in itself is absent.
#
# Honest gaps, stated plainly (same pattern as OS-033/OS-037):
# "drop-in switches the windows on the demo image" is NOT proven
# here by a booted demo image — there is no test image in this
# repo, so boot activation and the dashboard render under the
# demo profile stay owed on the demo image. What IS proven here:
# the drop-in parses as a [Service] section, points at the exact
# profile file the payload bake installs, the profile's values
# switch thresholds.py in a subprocess (drill
# intel/drills/demo_thresholds_dropin.py), and the production
# INT drill tournament still passes with a clean environment.
[Service]
EnvironmentFile=/opt/relay/intel/metaos-demo.env
