<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Science Lab reproduction cycle &mdash; CYCLE-EXAMPLE-001</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/vendor/fonts/fonts.css">
<style>
body { font-family: "Spline Sans", ui-sans-serif, system-ui, sans-serif; max-width: 46rem;
       margin: 2rem auto; padding: 0 1rem; color: #222; }
nav.home { font-size: 0.85rem; margin-bottom: 1rem; }
.badge { color: #fff; border-radius: 0.4rem; padding: 0.1rem 0.5rem;
          font-size: 0.85rem; white-space: nowrap; }
.claim { border: 1px solid #ddd; border-left-width: 0.4rem;
          border-radius: 0.4rem; padding: 0.6rem 1rem; margin: 1rem 0; }
.basis { margin: 0.3rem 0; }
.record { color: #555; font-size: 0.85rem; font-family: "Spline Sans Mono", ui-monospace, monospace; }
footer { color: #555; font-size: 0.85rem; margin-top: 2rem; }
h1, h2, h3 { font-weight: 600; letter-spacing: -0.01em; }
.cyclerow { border: 1px solid #ddd; border-radius: 0.4rem; padding: 0.6rem 1rem; margin: 0.6rem 0; }
.cyclerow a { font-weight: 600; }
.phases { font-size: 0.85rem; color: #555; }
#summary { background: #f4f7fa; border: 1px solid #ddd; border-radius: 0.4rem; padding: 0.6rem 1rem; }
.empty { border: 2px dashed #999; border-radius: 0.4rem; padding: 1.5rem; text-align: center; color: #555; }
ul.src { font-size: 0.85rem; }
code { font-family: "Spline Sans Mono", ui-monospace, monospace; }
</style>
</head>
<body>
<nav class="home"><a href="../">Science Lab home</a> &middot; <a href="../molecules/">Molecule bench</a></nav>
<div id="app" aria-live="polite"><p>Loading cycle records&hellip;</p></div>
<footer>Claims render at their recorded ledger level only &mdash; this page never upgrades a level.
Levels 4&ndash;6 are human-only (amber) and unreachable by this system alone.</footer>
<script>
"use strict";
// Detail view over labs/cycles (not a separate site: linked from labs/index.html).
// Every claim is displayed at its RECORDED ledger level — the badge text comes
// straight from entry.level with no arithmetic applied. Source-file links point
// at the cycle directory so each claim can be audited.
var BASE = "../cycles/";
var PHASES = [
  ["prereg", "prereg.md"],
  ["run", "run.py"],
  ["scored", "score.md"],
  ["recorded", "record.md"],
  ["verified", "verify/rerun_result.json"]
];

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}

function levelBadge(level) {
  // Recorded level only: level is rendered exactly as stored, never upgraded.
  var color = level >= 4 ? "#b26a00" : (level === 3 ? "#6525a8" : (level === 2 ? "#188038" : "#1a73e8"));
  var name = level >= 4 ? "amber (human-only)" : (level === 3 ? "purple" : (level === 2 ? "green" : "blue"));
  return '<span class="badge" style="background:' + color + '">Level ' + esc(level) +
    " &middot; " + name + "</span>";
}

function verdictBadge(v) {
  var color = v === "MATCH" ? "#188038" : (v === "DIFFER" ? "#b3261e" : "#555");
  return '<span class="badge" style="background:' + color + '">' + esc(v) + "</span>";
}

function srcLinks(id) {
  return '<ul class="src">' +
    '<li><a href="' + BASE + id + '/score.md">score.md</a> (verdict + comparison block)</li>' +
    '<li><a href="' + BASE + id + '/record.md">record.md</a> (question, method, ladder level earned)</li>' +
    '<li><a href="' + BASE + 'ledger.jsonl">ledger.jsonl</a> (hash-linked entry for ' + esc(id) + ")</li></ul>";
}

function head(url) {
  return fetch(url, { method: "GET", cache: "no-store" }).then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return true;
  }).catch(function () { return false; });
}

function phaseState(id) {
  return Promise.all(PHASES.map(function (p) { return head(BASE + id + "/" + p[1]); }))
    .then(function (hits) {
      return PHASES.map(function (p, i) { return { name: p[0], done: hits[i] }; });
    });
}

function loadLedger() {
  return fetch(BASE + "ledger.jsonl", { cache: "no-store" }).then(function (r) {
    if (!r.ok) throw new Error("ledger.jsonl unreachable (HTTP " + r.status + ")");
    return r.text();
  }).then(function (t) {
    return t.split("\n").filter(function (l) { return l.trim(); }).map(function (l) {
      var e = JSON.parse(l);
      if (typeof e.level !== "number" || !e.cycle_id || !e.verdict) throw new Error("ledger entry missing level/cycle_id/verdict");
      return e;
    });
  });
}

function phaseLine(phases) {
  var done = phases.filter(function (p) { return p.done; }).length;
  return '<span class="phases">' + phases.map(function (p) {
    return (p.done ? "&#9679; " : "&#9675; ") + esc(p.name);
  }).join(" &middot; ") + " &mdash; " + done + " of " + phases.length + " phases complete</span>";
}

function renderList(entries) {
  var app = document.getElementById("app");
  var match = entries.filter(function (e) { return e.verdict === "MATCH"; }).length;
  var differ = entries.filter(function (e) { return e.verdict === "DIFFER"; }).length;
  var html = "<h1>Reproduction cycles</h1>" +
    '<div id="summary" role="status">' + entries.length + " cycles &middot; " +
    entries.length + " of " + entries.length + " entered in ledger &middot; " +
    match + " MATCH &middot; " + differ + " DIFFER</div>" +
    "<h2>Cycle list</h2>";
  app.innerHTML = html;
  var wrap = document.createElement("div");
  app.appendChild(wrap);
  entries.forEach(function (e) {
    var row = document.createElement("div");
    row.className = "cyclerow";
    row.innerHTML = '<a href="?cycle=' + esc(e.cycle_id) + '">' + esc(e.cycle_id) + "</a> " +
      verdictBadge(e.verdict) + " " + levelBadge(e.level) +
      "<p>" + esc(e.question || "(no question recorded)") + "</p>" +
      '<p class="record">' + esc(e.metric) + " observed=" + esc(e.observed) +
      " expected=" + esc(e.expected) + " &plusmn;" + esc(e.tolerance) + "</p>" +
      '<p class="phases">phases: checking&hellip;</p>' + srcLinks(e.cycle_id);
    wrap.appendChild(row);
    phaseState(e.cycle_id).then(function (ph) {
      var done = ph.filter(function (p) { return p.done; }).length;
      row.querySelector(".phases").innerHTML =
        phaseLine(ph) + (done === ph.length ? "" : " &mdash; incomplete artifact set");
    });
  });
  var note = document.createElement("p");
  note.innerHTML = "Pick a cycle for its detail view. Missing directories render an explicit empty state, never a guess.";
  app.appendChild(note);
}

function renderDetail(entries, id) {
  var app = document.getElementById("app");
  var claims = entries.filter(function (e) { return e.cycle_id === id; });
  if (!claims.length) {
    // Empty state for a missing cycle directory / unknown id.
    app.innerHTML = "<h1>Cycle " + esc(id) + "</h1>" +
      '<div class="empty" role="status" data-empty="no-such-cycle">' +
      "<p><strong>No such cycle directory.</strong></p>" +
      "<p>There is no ledger entry and no <code>labs/cycles/" + esc(id) + "/</code> for this id. " +
      "Nothing is shown rather than something invented.</p>" +
      '<p><a href="./">Back to the cycle list</a></p></div>';
    return;
  }
  var e = claims[0];
  app.innerHTML = "<h1>Cycle " + esc(id) + "</h1>" +
    "<p>" + verdictBadge(e.verdict) + " " + levelBadge(e.level) + "</p>" +
    "<p>Question: " + esc(e.question || "(no question recorded)") + "</p>" +
    '<p class="record">' + esc(e.metric) + " observed=" + esc(e.observed) +
    " expected=" + esc(e.expected) + " &plusmn;" + esc(e.tolerance) +
    " &middot; verification: " + esc(e.verification_status || "unrecorded") + "</p>" +
    '<h2>Claims (displayed at recorded level, never higher)</h2><div id="claims"></div>' +
    "<h2>Phase state</h2>" + '<p class="phases">checking&hellip;</p>' +
    "<h2>Source files</h2>" + srcLinks(id) +
    '<p><a href="./">Back to the cycle list</a></p>';
  var box = document.getElementById("claims");
  claims.forEach(function (c) {
    var art = document.createElement("article");
    art.className = "claim";
    art.setAttribute("data-claim", id + "-" + esc(c.metric));
    art.setAttribute("data-level", String(c.level)); // recorded level, verbatim
    art.innerHTML = "<h3>" + esc(c.question || id) + " " + levelBadge(c.level) + "</h3>" +
      '<p class="basis">Basis: ledger entry ' + esc(c.entry_hash || "(unhashed)") +
      " in labs/cycles/ledger.jsonl; metric " + esc(c.metric) + " " +
      esc(c.observed) + " vs " + esc(c.expected) + " &plusmn;" + esc(c.tolerance) + "</p>" +
      '<p class="record">Record: ' + esc(c.cycle_id) + " &middot; verdict " + esc(c.verdict) +
      " &middot; level " + esc(c.level) + " (recorded)</p>";
    box.appendChild(art);
  });
  phaseState(id).then(function (ph) {
    document.querySelector("#app .phases").innerHTML = phaseLine(ph);
  });
}

function init() {
  var id = null;
  try { id = new URLSearchParams(location.search).get("cycle"); } catch (e) { id = null; }
  loadLedger().then(function (entries) {
    if (id) renderDetail(entries, id);
    else renderList(entries);
  }).catch(function (err) {
    document.getElementById("app").innerHTML =
      '<div class="empty" role="alert" data-empty="ledger-unreachable">' +
      "<p><strong>Cycle records unavailable.</strong></p>" +
      "<p>" + esc(err.message) + " Is this page served over HTTP so <code>labs/cycles/ledger.jsonl</code> can be read?</p></div>";
  });
}
document.addEventListener("DOMContentLoaded", init);
</script>
<!-- Desk chat over the Board (room "science"), the one messaging system. -->
<script src="../../js/site-chat.js" data-room="science" data-label="Science Lab"></script>
</body>
</html>
