<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meta OS — Board</title>
<style>
  :root {
    --bg: #0a0c10;
    --panel: #12161d;
    --line: #232b38;
    --text: #dde5ef;
    --dim: #8494a9;
    --accent: #58a6ff;
    --info: #58a6ff;
    --warning: #e3b341;
    --critical: #f85149;
    --ok: #3fb950;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
    padding: 13px 18px 9px;
    border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0; font-size: 19px; letter-spacing: 0.03em; }
  header h1 .os { color: var(--accent); }
  header .sub { color: var(--dim); font-size: 12px; }
  #conn { margin-left: auto; font-size: 12px; color: var(--dim); }
  #conn .ok { color: var(--ok); }
  #conn .bad { color: var(--critical); }
  #bar {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    padding: 10px 18px;
    border-bottom: 1px solid var(--line);
  }
  #bar label, #composer label { color: var(--dim); font-size: 12px; }
  input[type="text"] {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--text);
    font: inherit;
    padding: 5px 8px;
  }
  #room-name { width: 150px; }
  button {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--text);
    font: inherit;
    padding: 5px 12px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.on { border-color: var(--accent); color: var(--accent); }
  #room-list { display: flex; gap: 6px; flex-wrap: wrap; }
  #room-list .count { color: var(--dim); font-size: 12px; }
  main { padding: 12px 18px; }
  #lines { display: flex; flex-direction: column; gap: 3px; }
  .line {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 5px 10px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .line .nick { color: var(--accent); font-weight: bold; }
  .line .when { color: var(--dim); font-size: 12px; }
  .line.notify {
    border-left: 3px solid var(--info);
    background: #101826;
  }
  .line.notify.warning { border-left-color: var(--warning); }
  .line.notify.critical { border-left-color: var(--critical); }
  .line.notify .sev {
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
  }
  .line.notify.info .sev { color: var(--info); }
  .line.notify.warning .sev { color: var(--warning); }
  .line.notify.critical .sev { color: var(--critical); }
  .line.notify .topic { color: var(--dim); }
  .blank { color: var(--dim); font-size: 12px; padding: 4px 0; }
  #composer {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    padding: 12px 18px 18px;
    border-top: 1px solid var(--line);
  }
  #nick { width: 130px; }
  #text { flex: 1 1 260px; }
  #post-error { color: var(--critical); font-size: 12px; width: 100%; }
</style>
</head>
<body>
<header>
  <h1>Meta <span class="os">OS</span> — Board</h1>
  <span class="sub">in-OS messaging board · Layer 6</span>
  <span id="conn">connecting…</span>
</header>

<div id="bar">
  <label for="room-name">Room</label>
  <input type="text" id="room-name" value="main" maxlength="32">
  <button id="room-open" type="button">Open</button>
  <span id="room-list"></span>
</div>

<main>
  <div id="lines"><div class="blank">No messages in this room yet.</div></div>
</main>

<form id="composer">
  <label for="nick">Nick</label>
  <input type="text" id="nick" maxlength="40" autocomplete="off">
  <label for="text">Message</label>
  <input type="text" id="text" maxlength="2000" autocomplete="off">
  <button id="post" type="submit">Post</button>
  <div id="post-error"></div>
</form>

<script>
"use strict";
// Line protocol (same as relay/ "Meta Nuntius"):
//   "<nick>: <text> [ts:<epoch-seconds>]"
//   "board: NOTIFY:<id> <severity> [<topic>] <text> [ts:<epoch-seconds>]"
var NOTIFY_RE = /^board: NOTIFY:(ntf-[0-9a-f]{16}) (info|warning|critical) \[([^\]]*)\] ([\s\S]*)$/;
var MSG_RE = /^([^:]+): ([\s\S]*)$/;
var TS_RE = / \[ts:(\d+)\]$/;
var ROOM_RE = /^[a-z0-9-]{1,32}$/;

var room = "main";
var seen = -1; // watermark: index of the last line rendered in this room
var polling = false;

var linesEl = document.getElementById("lines");
var connEl = document.getElementById("conn");
var roomInput = document.getElementById("room-name");
var roomListEl = document.getElementById("room-list");
var nickInput = document.getElementById("nick");
var textInput = document.getElementById("text");
var errorEl = document.getElementById("post-error");

nickInput.value = localStorage.getItem("board-nick") || "";

function splitTs(raw) {
  var m = raw.match(TS_RE);
  if (!m) return { body: raw, ts: null };
  return { body: raw.slice(0, m.index), ts: Number(m[1]) };
}

function timeSpan(ts) {
  var span = document.createElement("span");
  span.className = "when";
  span.textContent = " " + new Date(ts * 1000).toLocaleString();
  return span;
}

function renderLine(raw) {
  var parts = splitTs(raw);
  var div = document.createElement("div");
  div.className = "line";

  var notify = parts.body.match(NOTIFY_RE);
  if (notify) {
    div.classList.add("notify", notify[2]);
    div.title = notify[1];
    var sev = document.createElement("span");
    sev.className = "sev";
    sev.textContent = notify[2];
    div.appendChild(sev);
    var topic = document.createElement("span");
    topic.className = "topic";
    topic.textContent = " [" + notify[3] + "] ";
    div.appendChild(topic);
    div.appendChild(document.createTextNode(notify[4]));
  } else {
    var msg = parts.body.match(MSG_RE);
    if (msg) {
      var nick = document.createElement("span");
      nick.className = "nick";
      nick.textContent = msg[1];
      div.appendChild(nick);
      div.appendChild(document.createTextNode(": " + msg[2]));
    } else {
      div.textContent = parts.body;
    }
  }
  if (parts.ts !== null) div.appendChild(timeSpan(parts.ts));

  var blank = linesEl.querySelector(".blank");
  if (blank) blank.remove();
  linesEl.appendChild(div);
}

function openRoom(next) {
  if (!ROOM_RE.test(next)) {
    connEl.innerHTML = '<span class="bad">invalid room name</span>';
    return;
  }
  room = next;
  roomInput.value = next;
  seen = -1;
  linesEl.innerHTML = '<div class="blank">No messages in this room yet.</div>';
  markActiveRoom();
  poll();
}

function markActiveRoom() {
  var buttons = roomListEl.querySelectorAll("button[data-room]");
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].classList.toggle("on", buttons[i].dataset.room === room);
  }
}

async function refreshRoomList() {
  try {
    var res = await fetch("/rooms");
    if (!res.ok) return;
    var data = await res.json();
    roomListEl.innerHTML = "";
    data.rooms.forEach(function (entry) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.dataset.room = entry.room;
      btn.textContent = entry.room + " ";
      var count = document.createElement("span");
      count.className = "count";
      count.textContent = "(" + entry.count + ")";
      btn.appendChild(count);
      btn.addEventListener("click", function () { openRoom(entry.room); });
      roomListEl.appendChild(btn);
    });
    markActiveRoom();
  } catch (err) {
    // The status line already reports connectivity; the list is a bonus.
  }
}

async function poll() {
  if (polling) return;
  polling = true;
  try {
    var res = await fetch(
      "/rooms/" + encodeURIComponent(room) + "/messages?since=" + seen
    );
    if (!res.ok) throw new Error("HTTP " + res.status);
    var data = await res.json();
    data.messages.forEach(function (line) {
      seen += 1;
      renderLine(line);
    });
    connEl.innerHTML =
      "room <b>" + room + "</b> · " + data.total +
      ' lines · <span class="ok">live</span>';
  } catch (err) {
    connEl.innerHTML = '<span class="bad">board unreachable</span>';
  } finally {
    polling = false;
  }
}

document.getElementById("room-open").addEventListener("click", function () {
  openRoom(roomInput.value.trim());
});
roomInput.addEventListener("keydown", function (ev) {
  if (ev.key === "Enter") openRoom(roomInput.value.trim());
});

document.getElementById("composer").addEventListener("submit", async function (ev) {
  ev.preventDefault();
  errorEl.textContent = "";
  var nick = nickInput.value.trim();
  var text = textInput.value.trim();
  if (!nick || !text) {
    errorEl.textContent = "nick and message are both required";
    return;
  }
  localStorage.setItem("board-nick", nick);
  try {
    var res = await fetch(
      "/rooms/" + encodeURIComponent(room) + "/messages",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nick: nick, text: text }),
      }
    );
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
    textInput.value = "";
    poll();
    refreshRoomList();
  } catch (err) {
    errorEl.textContent = "post failed: " + err.message;
  }
});

poll();
refreshRoomList();
setInterval(poll, 2000);
setInterval(refreshRoomList, 10000);
</script>
</body>
</html>
