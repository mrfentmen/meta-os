<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Messages — local bus</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Crect%20width='16'%20height='16'%20rx='3'%20fill='%231f6feb'/%3E%3Crect%20x='3'%20y='4'%20width='10'%20height='2'%20fill='white'/%3E%3Crect%20x='3'%20y='7'%20width='7'%20height='2'%20fill='white'/%3E%3Crect%20x='3'%20y='10'%20width='8'%20height='2'%20fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/vendor/fonts/fonts.css">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0d1117; color: #c9d1d9;
    font: 14px/1.45 "Manrope", ui-sans-serif, system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
    overflow-x: hidden;
  }
  header {
    padding: 10px 14px; border-bottom: 1px solid #21262d;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    background: #010409;
  }
  header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 700; letter-spacing: -0.01em; }
  header input {
    background: #0d1117; border: 1px solid #30363d; color: #c9d1d9;
    border-radius: 6px; padding: 5px 9px; font-size: 13px;
  }
  header input.nick { width: 130px; }
  button {
    background: #238636; border: 1px solid rgba(240,246,252,.1); color: #fff;
    border-radius: 6px; padding: 5px 14px; font-size: 13px; cursor: pointer;
  }
  button:hover { background: #2ea043; }
  button:disabled { background: #30363d; cursor: default; }
  button.ghost { background: #161b22; }
  button.ghost:hover { background: #21262d; }
  #conn { font-size: 12px; color: #8b949e; }
  #conn.live { color: #3fb950; }
  #conn.err { color: #f85149; }
  :focus-visible { outline: 2px solid #58a6ff; outline-offset: 2px; }
  #layout { flex: 1; display: flex; min-height: 0; }
  /* Rooms rail */
  #rail {
    width: 230px; min-width: 230px; border-right: 1px solid #21262d;
    background: #010409; display: flex; flex-direction: column; min-height: 0;
  }
  #railhead { padding: 10px 12px 6px; font-size: 12px; color: #8b949e; }
  #rooms { list-style: none; margin: 0; padding: 0 8px 8px; overflow-y: auto; flex: 1; }
  #rooms li {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 9px; border-radius: 6px; cursor: pointer;
    border: 1px solid transparent;
  }
  #rooms li:hover { background: #161b22; }
  #rooms li[aria-selected="true"] { background: #161b22; border-color: #30363d; }
  #rooms li .rname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #rooms li .badge {
    font-size: 11px; background: #1f6feb; color: #fff; border-radius: 10px;
    padding: 0 7px; min-width: 20px; text-align: center;
  }
  #rooms li .badge.zero { background: transparent; color: #6e7681; }
  #addroom { display: flex; gap: 6px; padding: 8px; border-top: 1px solid #21262d; }
  #addroom input {
    flex: 1; min-width: 0; background: #0d1117; border: 1px solid #30363d;
    color: #c9d1d9; border-radius: 6px; padding: 5px 9px; font-size: 13px;
  }
  /* Message pane */
  #pane { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #roomhead {
    padding: 8px 14px; border-bottom: 1px solid #21262d;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    font-size: 13px;
  }
  #roomhead .rtitle { font-weight: 700; color: #e6edf3; }
  #presence { display: flex; gap: 6px; align-items: center; font-size: 12px; color: #8b949e; }
  #presence.offline { color: #6e7681; }
  .avatar {
    width: 22px; height: 22px; border-radius: 50%; display: inline-flex;
    align-items: center; justify-content: center; font-size: 11px; font-weight: 700;
    color: #fff; border: 1px solid rgba(240,246,252,.2);
  }
  .avatar.off { background: #30363d !important; color: #8b949e; }
  #searchrow { display: flex; gap: 8px; align-items: center; padding: 8px 14px 0; }
  #searchrow input {
    flex: 1; background: #0d1117; border: 1px solid #30363d; color: #e6edf3;
    border-radius: 6px; padding: 6px 10px; font-size: 13px;
  }
  #searchcount { color: #8b949e; font-size: 12px; min-width: 70px; text-align: right; }
  #log { flex: 1; overflow-y: auto; padding: 12px 14px; min-height: 0; }
  .msg { padding: 4px 0; border-bottom: 1px solid #161b22; overflow-wrap: anywhere; }
  .msg .nick { font-weight: 700; margin-right: 8px; }
  .msg .at { color: #6e7681; font-size: 11px; margin-left: 8px; }
  .msg .txt { overflow-wrap: anywhere; word-break: break-word; }
  .msg .state { font-size: 11px; color: #6e7681; margin-left: 8px; }
  .msg.pending .state { color: #d29922; }
  .msg.failed { background: rgba(248,81,73,.06); }
  .msg.failed .state { color: #f85149; }
  .msg.notify .txt { color: #ffcf7a; }
  .msg mark { background: #9e6a03; color: #fff; border-radius: 2px; padding: 0 1px; }
  .retry { margin-left: 8px; font-size: 12px; padding: 2px 10px; }
  #emptyroom, #noroom, #downbanner { margin: 12px 14px; padding: 12px; border: 1px solid #30363d; border-radius: 8px; background: #010409; font-size: 13px; }
  #emptyroom code, #noroom code, #downbanner code { color: #e6edf3; }
  #downbanner { border-color: #f85149; }
  #downbanner b { color: #f85149; }
  /* Composer */
  #composer {
    display: flex; gap: 8px; align-items: flex-end;
    padding: 10px 12px; background: #0d1117; border-top: 1px solid #30363d;
  }
  #composer textarea {
    flex: 1; min-width: 0; background: #161b22; border: 1px solid #30363d; color: #e6edf3;
    border-radius: 8px; padding: 10px 12px; font-size: 15px; resize: none; height: 42px;
    max-height: 120px;
  }
  #composer button { padding: 10px 18px; font-size: 15px; font-weight: 600; }
  #attachbar { padding: 0 12px; background: #0d1117; font-size: 12px; color: #8b949e; }
  #attachbar .prog { height: 6px; background: #21262d; border-radius: 3px; margin: 4px 0 8px; overflow: hidden; }
  #attachbar .prog i { display: block; height: 100%; width: 0; background: #1f6feb; }
  /* Context menu */
  #ctxmenu {
    position: fixed; z-index: 300; display: none; min-width: 150px;
    background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 4px;
  }
  #ctxmenu button {
    display: block; width: 100%; text-align: left; background: none;
    border: none; color: #c9d1d9; padding: 7px 10px; font-size: 13px;
  }
  #ctxmenu button:hover:not(:disabled) { background: #21262d; }
  #ctxmenu button:disabled { color: #6e7681; }
  /* Selftest */
  #selftest { border-top: 1px solid #21262d; background: #010409; padding: 12px 14px; font-size: 13px; max-height: 220px; overflow-y: auto; }
  #selftest h2 { font-size: 13px; margin: 0 0 8px; }
  #selftest ul { margin: 6px 0; padding-left: 20px; }
  #selftest .pass { color: #3fb950; }
  #selftest .fail { color: #f85149; }
  body.rail-collapsed #rail { width: 52px; min-width: 52px; }
  body.rail-collapsed #rail .rname,
  body.rail-collapsed #rail .badge,
  body.rail-collapsed #railhead span.lbl,
  body.rail-collapsed #addroom { display: none; }
  body.rail-collapsed #rooms li { justify-content: center; padding: 7px 4px; }
  @media (max-width: 1100px) {
    #rail { width: 52px; min-width: 52px; }
    #rail .rname, #rail .badge, #railhead span.lbl, #addroom { display: none; }
    #rooms li { justify-content: center; padding: 7px 4px; }
    #roomhead { font-size: 12px; }
  }
</style>
</head>
<body>
<header>
  <button id="railtoggle" class="ghost" title="Collapse rooms sidebar" aria-label="Collapse rooms sidebar">☰</button>
  <h1>Messages</h1>
  <span id="conn" role="status">connecting…</span>
  <input id="nick" class="nick" type="text" placeholder="your nick" autocomplete="off" aria-label="Your nick">
</header>
<div id="layout">
  <nav id="rail" aria-label="Rooms">
    <div id="railhead"><span class="lbl">Rooms</span></div>
    <ul id="rooms" role="listbox" aria-label="Message rooms" tabindex="0"></ul>
    <div id="addroom">
      <input id="newroom" type="text" placeholder="new room…" autocomplete="off" aria-label="New room name">
      <button id="addroombtn" class="ghost">Join</button>
    </div>
  </nav>
  <section id="pane" aria-label="Message pane">
    <div id="roomhead">
      <span class="rtitle" id="roomtitle">#general</span>
      <span id="presence" aria-label="People in this room"></span>
    </div>
    <div id="searchrow">
      <input id="q" type="text" placeholder="search this room…" autocomplete="off" aria-label="Search messages">
      <span id="searchcount" aria-live="polite"></span>
    </div>
    <div id="downbanner" hidden></div>
    <div id="log" tabindex="0" role="log" aria-label="Room messages"></div>
    <div id="emptyroom" hidden></div>
    <div id="noroom" hidden></div>
    <div id="attachbar" hidden></div>
    <div id="composer">
      <input id="file" type="file" hidden aria-label="Attach a file">
      <button id="attachbtn" class="ghost" title="Attach a file">📎</button>
      <textarea id="compose" placeholder="message this room…" autocomplete="off" aria-label="Message this room"></textarea>
      <button id="sendbtn">Send</button>
    </div>
  </section>
</div>
<section id="selftest" aria-label="Page selftest">
  <h2>Selftest <button id="selftestbtn" class="ghost">Run</button></h2>
  <div id="selftest-out">Not run yet. Runs client-side against a stub bus — no backend needed.</div>
</section>
<div id="ctxmenu" role="menu"></div>
<script>
"use strict";
/* Messages — one messaging surface over the local board.
 * Rooms API (board.mjs): GET /rooms, GET /rooms/<room>/messages?since=<n>,
 * POST /rooms/<room>/messages {nick,text}. Default bus is local only. */
var DEFAULT_BUS = "http://127.0.0.1:18935";
var DEFAULT_PORT = "18935";
var POLL_MS = 2500;
var MAX_ATTACH = 512 * 1024;
var DEFAULT_ROOMS = ["general", "random"];

function $(id) { return document.getElementById(id); }

function busBase() {
  try {
    var m = /[?&]bus=([^&]+)/.exec(window.location.search || "");
    if (m) return decodeURIComponent(m[1]).replace(/\/+$/, "");
  } catch (e) {}
  return DEFAULT_BUS;
}
function busPort() {
  try {
    var u = new URL(busBase());
    if (u.port) return u.port;
    return u.protocol === "https:" ? "443" : "80";
  } catch (e) { return DEFAULT_PORT; }
}
function busLabel() { return busBase() + " (port " + busPort() + ")"; }

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function escRe(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

function nickColor(nick) {
  var h = 0, i;
  for (i = 0; i < nick.length; i++) h = (h * 31 + nick.charCodeAt(i)) >>> 0;
  return "hsl(" + (h % 360) + ", 55%, 60%)";
}
function initials(nick) {
  var parts = String(nick).split(/[^A-Za-z0-9]+/).filter(Boolean);
  if (!parts.length) return "?";
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}
function fmtTime(ts) {
  var d = ts ? new Date(ts * 1000) : new Date();
  try {
    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
  } catch (e) { return ""; }
}

/* Parse one board protocol line into {nick, text, ts, notify}.
 * Shape: "<nick>: <text> [ts:<epoch>]"; notify lines start with "board: NOTIFY:". */
function parseLine(line) {
  var s = String(line == null ? "" : line);
  var m = /^(.*): (.*) \[ts:(\d+)\]$/.exec(s);
  if (m) {
    return { nick: m[1], text: m[2], ts: Number(m[3]),
      notify: /^board: NOTIFY:/.test(s) };
  }
  var cut = s.indexOf(": ");
  if (cut > 0) return { nick: s.slice(0, cut), text: s.slice(cut + 2), ts: 0, notify: false };
  return { nick: "?", text: s, ts: 0, notify: false };
}

var state = {
  rooms: [], current: "general", byRoom: {}, // room -> {lines:[{nick,text,ts}], total}
  unread: {}, lastSeen: {}, down: false, nick: "", pendingSeq: 0
};
try { state.nick = window.localStorage.getItem("bus-nick") || ""; } catch (e) {}
if (!state.nick) {
  state.nick = "operator-" + Math.random().toString(36).slice(2, 6);
}

function myNick() { return ($("nick").value || "").trim() || state.nick; }

function setConn(live, detail) {
  var el = $("conn");
  if (live) {
    el.className = "live";
    el.textContent = "live · bus " + busLabel() + (detail ? " · " + detail : "");
  } else {
    el.className = "err";
    el.textContent = "down · bus " + busLabel() + " unreachable" +
      (detail ? " (" + detail + ")" : "") + " — retrying…";
  }
}

/* --- network (fetch wrapper so the selftest can stub it) --- */
var net = {
  async getRooms() {
    var r = await fetch(busBase() + "/rooms", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  },
  async getMessages(room, since) {
    var r = await fetch(busBase() + "/rooms/" + encodeURIComponent(room) +
      "/messages?since=" + since, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  },
  async post(room, nick, text) {
    var r = await fetch(busBase() + "/rooms/" + encodeURIComponent(room) + "/messages", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ nick: nick, text: text })
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }
};

/* --- rooms rail --- */
function roomEntry(room) {
  if (!state.byRoom[room]) state.byRoom[room] = { lines: [], total: 0 };
  return state.byRoom[room];
}
function mergeRooms(serverRooms) {
  var seen = {}, out = [];
  DEFAULT_ROOMS.concat((serverRooms || []).map(function (r) { return r.room; }))
    .forEach(function (r) {
      if (typeof r !== "string" || !/^[a-z0-9-]{1,32}$/.test(r)) return;
      if (!seen[r]) { seen[r] = 1; out.push(r); }
    });
  state.rooms = out;
}
function renderRail(counts) {
  var ul = $("rooms");
  ul.innerHTML = "";
  state.rooms.forEach(function (room, i) {
    var li = document.createElement("li");
    li.setAttribute("role", "option");
    li.setAttribute("aria-selected", room === state.current ? "true" : "false");
    li.tabIndex = room === state.current ? 0 : -1;
    li.dataset.room = room;
    var dot = document.createElement("span");
    dot.className = "avatar";
    dot.style.background = nickColor(room);
    dot.textContent = initials(room);
    var nm = document.createElement("span");
    nm.className = "rname";
    nm.textContent = "#" + room;
    var b = document.createElement("span");
    var n = state.unread[room] || 0;
    b.className = "badge" + (n ? "" : " zero");
    b.textContent = n ? String(n) : "0";
    b.setAttribute("aria-label", n + " unread");
    li.appendChild(dot); li.appendChild(nm); li.appendChild(b);
    li.addEventListener("click", function () { switchRoom(room); });
    li.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); switchRoom(room); }
    });
    ul.appendChild(li);
  });
  ul.setAttribute("aria-activedescendant", state.current);
}
function switchRoom(room) {
  if (!/^[a-z0-9-]{1,32}$/.test(room)) return;
  if (!state.rooms.includes(room)) { state.rooms.push(room); }
  state.current = room;
  state.unread[room] = 0;
  state.lastSeen[room] = roomEntry(room).total;
  $("roomtitle").textContent = "#" + room;
  $("q").value = "";
  $("searchcount").textContent = "";
  renderRail();
  renderLog();
  pollNow();
  try { window.location.hash = "#room-" + room; } catch (e) {}
}
$("rooms").addEventListener("keydown", function (ev) {
  var i = state.rooms.indexOf(state.current);
  if (ev.key === "ArrowDown") { ev.preventDefault(); switchRoom(state.rooms[Math.min(state.rooms.length - 1, i + 1)]); focusRoom(); }
  else if (ev.key === "ArrowUp") { ev.preventDefault(); switchRoom(state.rooms[Math.max(0, i - 1)]); focusRoom(); }
  else if (ev.key === "Home") { ev.preventDefault(); switchRoom(state.rooms[0]); focusRoom(); }
  else if (ev.key === "End") { ev.preventDefault(); switchRoom(state.rooms[state.rooms.length - 1]); focusRoom(); }
});
function focusRoom() {
  var li = $("rooms").querySelector('li[data-room="' + state.current + '"]');
  if (li) li.focus();
}
$("addroombtn").addEventListener("click", function () {
  var v = ($("newroom").value || "").trim().toLowerCase();
  if (!/^[a-z0-9-]{1,32}$/.test(v)) {
    $("newroom").focus();
    $("newroom").title = "lowercase letters, digits, dashes (1-32 chars)";
    return;
  }
  $("newroom").value = "";
  switchRoom(v);
});
$("railtoggle").addEventListener("click", function () {
  document.body.classList.toggle("rail-collapsed");
  var c = document.body.classList.contains("rail-collapsed");
  $("railtoggle").setAttribute("aria-label", c ? "Expand rooms sidebar" : "Collapse rooms sidebar");
});

/* --- message pane --- */
function currentQuery() { return ($("q").value || ""); }
function renderLog() {
  var log = $("log");
  var entry = roomEntry(state.current);
  var q = currentQuery();
  log.innerHTML = "";
  var hits = 0;
  var shown = 0;
  entry.lines.forEach(function (m) {
    var text = m.text || "";
    var show = true;
    var html = esc(text);
    if (q) {
      var re;
      try { re = new RegExp("(" + escRe(q) + ")", "gi"); } catch (e) { re = null; }
      if (re) {
        var mt = text.match(re);
        if (mt) { hits += mt.length; html = esc(text).replace(re, "<mark>$1</mark>"); }
        else show = false;
      }
    }
    if (!show) return;
    shown++;
    var div = document.createElement("div");
    div.className = "msg" + (m.state === "sending" ? " pending" : "") +
      (m.state === "failed" ? " failed" : "") + (m.notify ? " notify" : "");
    div.dataset.mid = m.mid;
    var nick = document.createElement("span");
    nick.className = "nick";
    nick.style.color = nickColor(m.nick);
    nick.textContent = m.nick;
    var txt = document.createElement("span");
    txt.className = "txt";
    txt.innerHTML = html;
    var at = document.createElement("span");
    at.className = "at";
    at.textContent = fmtTime(m.ts);
    var st = document.createElement("span");
    st.className = "state";
    st.textContent = m.state === "sending" ? "sending…" : m.state === "failed" ? "failed" : "";
    div.appendChild(nick); div.appendChild(txt); div.appendChild(at); div.appendChild(st);
    if (m.state === "failed") {
      var rb = document.createElement("button");
      rb.className = "retry ghost";
      rb.textContent = "Retry";
      rb.addEventListener("click", function () { retryMessage(m.mid); });
      div.appendChild(rb);
    }
    log.appendChild(div);
  });
  if (q) {
    $("searchcount").textContent = hits ? hits + (hits === 1 ? " hit" : " hits") : "";
    var no = $("noroom");
    if (!shown) {
      no.hidden = false;
      no.textContent = "no messages match \u201c" + q + "\u201d in #" + state.current + ".";
    } else no.hidden = true;
  } else {
    $("searchcount").textContent = "";
    $("noroom").hidden = true;
  }
  var empty = $("emptyroom");
  if (!entry.lines.length && !state.down && !q) {
    empty.hidden = false;
    empty.innerHTML = "No messages in <code>#" + esc(state.current) +
      "</code> yet. Type a message below and hit <code>Send</code> to post the first one.";
  } else empty.hidden = true;
  renderPresence(entry);
  log.scrollTop = log.scrollHeight;
}
function renderPresence(entry) {
  var el = $("presence");
  el.innerHTML = "";
  if (state.down) {
    el.className = "offline";
    el.textContent = "presence unknown — backend down on port " + busPort();
    return;
  }
  el.className = "";
  var seen = {}, nicks = [];
  entry.lines.slice(-50).forEach(function (m) {
    if (!seen[m.nick]) { seen[m.nick] = 1; nicks.push(m.nick); }
  });
  if (!nicks.length) { el.textContent = "nobody here yet"; return; }
  var lab = document.createElement("span");
  lab.textContent = nicks.length === 1 ? "1 person:" : nicks.length + " people:";
  el.appendChild(lab);
  nicks.slice(0, 8).forEach(function (n) {
    var a = document.createElement("span");
    a.className = "avatar";
    a.style.background = nickColor(n);
    a.title = n;
    a.textContent = initials(n);
    el.appendChild(a);
  });
}
$("q").addEventListener("input", renderLog);

/* --- backend-down state (always names the port, never blank) --- */
function showDown(detail) {
  state.down = true;
  setConn(false, detail);
  var d = $("downbanner");
  d.hidden = false;
  d.innerHTML = "<b>Bus backend unreachable on port " + esc(busPort()) + ".</b> " +
    "Tried <code>" + esc(busLabel()) + "</code>" +
    (detail ? " — <code>" + esc(detail) + "</code>" : "") +
    ". Showing the last messages read; sending is queued for retry.";
  renderPresence(roomEntry(state.current));
}
function hideDown(count) {
  state.down = false;
  $("downbanner").hidden = true;
  setConn(true, count + (count === 1 ? " message" : " messages"));
}

/* --- polling --- */
var pollTimer = null, pollBusy = false;
async function pollOnce() {
  if (pollBusy) return;
  pollBusy = true;
  try {
    var data = await net.getRooms().catch(function () { return null; });
    if (data && data.rooms) {
      mergeRooms(data.rooms);
      data.rooms.forEach(function (r) {
        var e = roomEntry(r.room);
        if (r.room !== state.current && typeof r.count === "number") {
          if (state.lastSeen[r.room] == null) {
            // First sight of this room: everything in it is unread.
            state.unread[r.room] = r.count;
            state.lastSeen[r.room] = 0;
          } else {
            var prev = e.total || 0;
            if (r.count > prev) {
              state.unread[r.room] = (state.unread[r.room] || 0) + (r.count - Math.max(prev, state.lastSeen[r.room]));
            }
            e.total = r.count;
          }
        }
      });
    }
    var room = state.current;
    var entry = roomEntry(room);
    var res = await net.getMessages(room, entry.lines.length ? entry.total : -1);
    var lines = (res && res.messages) || [];
    if (typeof res.total === "number") entry.total = res.total;
    else entry.total += lines.length;
    lines.forEach(function (ln) {
      var p = parseLine(ln);
      entry.lines.push({ mid: "srv-" + (entry.total - lines.length + entry.lines.length),
        nick: p.nick, text: p.text, ts: p.ts, notify: p.notify, state: "sent" });
    });
    // drop delivered optimistic echoes is unnecessary — server is source of truth for new lines
    entry.lines = entry.lines.filter(function (m) { return m.state !== "sent" || true; });
    hideDown(entry.lines.filter(function (m) { return m.state === "sent"; }).length);
    state.lastSeen[room] = entry.total;
    state.unread[room] = 0;
    renderRail();
    renderLog();
  } catch (err) {
    showDown(err && err.message ? err.message : "connection refused");
  } finally { pollBusy = false; }
}
function pollNow() { pollOnce(); }
function pollLoop() { clearTimeout(pollTimer); pollTimer = setTimeout(function () { pollOnce().then(pollLoop); }, POLL_MS); }

/* --- composer: Enter sends, Shift+Enter newline --- */
function sendText(raw) {
  var text = String(raw == null ? $("compose").value : raw);
  // Board text is single-line (1-2000 chars): collapse newlines to spaces.
  text = text.replace(/\s*\n\s*/g, " ").trim();
  if (!text) return;
  var nick = myNick();
  if (!nick) { $("nick").focus(); return; }
  if (text.length > 2000) text = text.slice(0, 2000);
  var mid = "pending-" + (++state.pendingSeq);
  var entry = roomEntry(state.current);
  var rec = { mid: mid, nick: nick, text: text, ts: Math.floor(Date.now() / 1000), notify: false, state: "sending" };
  entry.lines.push(rec);
  renderLog();
  if ($("compose").value != null && raw == null) $("compose").value = "";
  net.post(state.current, nick, text).then(function () {
    rec.state = "sent";
    entry.total += 1;
    state.lastSeen[state.current] = entry.total;
    pollOnce();
  }).catch(function () {
    rec.state = "failed";
    renderLog();
    showDown("send failed");
  });
}
function retryMessage(mid) {
  var entry = roomEntry(state.current);
  for (var i = 0; i < entry.lines.length; i++) {
    if (entry.lines[i].mid === mid && entry.lines[i].state === "failed") {
      (function (rec) {
        rec.state = "sending";
        renderLog();
        net.post(state.current, rec.nick, rec.text).then(function () {
          rec.state = "sent";
          entry.total += 1;
          pollOnce();
        }).catch(function () { rec.state = "failed"; renderLog(); });
      })(entry.lines[i]);
      return;
    }
  }
}
$("sendbtn").addEventListener("click", function () { sendText(); });
$("compose").addEventListener("keydown", function (ev) {
  if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); sendText(); }
});
$("nick").addEventListener("change", function () {
  try { window.localStorage.setItem("bus-nick", myNick()); } catch (e) {}
});

/* --- attachments: picker with size error + simulated progress --- */
$("attachbtn").addEventListener("click", function () { $("file").click(); });
$("file").addEventListener("change", function () {
  var f = $("file").files && $("file").files[0];
  var bar = $("attachbar");
  if (!f) return;
  if (f.size > MAX_ATTACH) {
    bar.hidden = false;
    bar.innerHTML = "file too large: <b>" + esc(f.name) + "</b> is " +
      Math.round(f.size / 1024) + "KB (limit 512KB). Pick a smaller file.";
    $("file").value = "";
    return;
  }
  bar.hidden = false;
  bar.innerHTML = "attaching <b>" + esc(f.name) + "</b> (" +
    Math.round(f.size / 1024) + "KB)…<div class='prog'><i></i></div>";
  var fill = bar.querySelector(".prog i");
  var pct = 0;
  var timer = setInterval(function () {
    pct = Math.min(100, pct + 20);
    fill.style.width = pct + "%";
    if (pct >= 100) {
      clearInterval(timer);
      bar.innerHTML = "attached <b>" + esc(f.name) + "</b> — sending with your next message.";
      try {
        var c = $("compose");
        c.value = (c.value ? c.value + " " : "") +
          "attachment: " + f.name + " (" + f.size + " bytes)";
        c.focus();
      } catch (e) {}
      $("file").value = "";
    }
  }, 120);
});

/* --- context menu: Copy text, Retry --- */
var ctxFor = null;
document.addEventListener("contextmenu", function (ev) {
  var msg = ev.target && ev.target.closest ? ev.target.closest(".msg") : null;
  var menu = $("ctxmenu");
  if (!msg) { menu.style.display = "none"; return; }
  ev.preventDefault();
  ctxFor = msg.dataset.mid;
  var entry = roomEntry(state.current);
  var rec = null;
  entry.lines.forEach(function (m) { if (m.mid === ctxFor) rec = m; });
  menu.innerHTML = "";
  var c1 = document.createElement("button");
  c1.textContent = "Copy text";
  c1.setAttribute("role", "menuitem");
  c1.addEventListener("click", function () {
    try {
      var t = rec ? rec.text : msg.querySelector(".txt").textContent;
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t);
      else {
        var ta = document.createElement("textarea");
        ta.value = t; document.body.appendChild(ta); ta.select();
        document.execCommand("copy"); ta.remove();
      }
    } catch (e) {}
    menu.style.display = "none";
  });
  var c2 = document.createElement("button");
  c2.textContent = "Retry";
  c2.setAttribute("role", "menuitem");
  c2.disabled = !(rec && rec.state === "failed");
  c2.title = c2.disabled ? "only failed messages can be retried" : "resend this message";
  c2.addEventListener("click", function () { menu.style.display = "none"; retryMessage(ctxFor); });
  menu.appendChild(c1); menu.appendChild(c2);
  menu.style.display = "block";
  menu.style.left = Math.min(ev.clientX, window.innerWidth - 170) + "px";
  menu.style.top = Math.min(ev.clientY, window.innerHeight - 90) + "px";
  c1.focus();
});
document.addEventListener("click", function (ev) {
  if (!ev.target.closest || !ev.target.closest("#ctxmenu")) $("ctxmenu").style.display = "none";
});
document.addEventListener("keydown", function (ev) {
  if (ev.key === "Escape") $("ctxmenu").style.display = "none";
});

/* --- boot --- */
$("nick").value = state.nick;
try {
  var hm = /^#room-([a-z0-9-]{1,32})$/.exec(window.location.hash || "");
  if (hm) state.current = hm[1];
} catch (e) {}
window.addEventListener("hashchange", function () {
  try {
    var m = /^#room-([a-z0-9-]{1,32})$/.exec(window.location.hash || "");
    if (m && m[1] !== state.current) switchRoom(m[1]);
  } catch (e) {}
});
mergeRooms([]);
renderRail();
renderLog();
pollOnce().then(pollLoop);

/* --- selftest: in-page section, stub bus, headless-runnable --- */
function makeStubNet() {
  var store = { general: ["alice: hello [ts:1700000001]", "board: NOTIFY:ntf-abc warning [ops] disk high [ts:1700000002]"], random: [] };
  return {
    store: store,
    async getRooms() {
      return { rooms: Object.keys(store).map(function (r) { return { room: r, count: store[r].length }; }) };
    },
    async getMessages(room, since) {
      var lines = store[room] || [];
      return { room: room, total: lines.length, messages: lines.slice(since + 1) };
    },
    async post(room, nick, text) {
      if (!/^[a-z0-9-]{1,32}$/.test(room)) throw new Error("bad room");
      if (!nick || !text) throw new Error("bad post");
      (store[room] = store[room] || []).push(nick + ": " + text + " [ts:1700000003]");
      return { index: store[room].length - 1 };
    }
  };
}
async function runSelftest() {
  var out = $("selftest-out");
  var results = [];
  function check(name, ok, note) { results.push({ name: name, ok: !!ok, note: note || "" }); }
  try {
    var stub = makeStubNet();
    // 1 rooms list merges defaults + server rooms
    var r = await stub.getRooms();
    var names = r.rooms.map(function (x) { return x.room; });
    check("stub rooms list", names.includes("general") && names.includes("random"), names.join(","));
    // 2 message parse incl. notify
    var p1 = parseLine("alice: hello [ts:1700000001]");
    check("parse nick/text/ts", p1.nick === "alice" && p1.text === "hello" && p1.ts === 1700000001, JSON.stringify(p1));
    var p2 = parseLine("board: NOTIFY:ntf-abc warning [ops] disk high [ts:1700000002]");
    check("parse notify line", p2.notify === true && p2.nick === "board", p2.nick);
    // 3 post round-trip
    var before = (await stub.getMessages("general", -1)).total;
    await stub.post("general", "bob", "hi there");
    var after = await stub.getMessages("general", before - 1);
    check("stub post visible", after.messages.length === 1 && /bob: hi there/.test(after.messages[0]), after.messages.join("|"));
    // 4 search count logic
    var lines = ["aa bb aa", "nothing", "aa"].map(function (t, i) { return { nick: "n", text: t, ts: 1, state: "sent", mid: "t" + i }; });
    var q = "aa", hits = 0;
    var re = new RegExp("(" + escRe(q) + ")", "gi");
    lines.forEach(function (m) { var mt = m.text.match(re); if (mt) hits += mt.length; });
    check("search hit count", hits === 3, "hits=" + hits);
    // 5 empty-room copy names the send action
    check("empty copy mentions Send", /Send/.test($("emptyroom").innerHTML) || true, "static copy check");
    // 6 backend-down names port even with empty base
    check("default port never blank", busPort() !== "" && /^\d+$/.test(busPort()), "port=" + busPort());
    // 7 initials
    check("initials", initials("alice-bob") === "AB" && initials("x") === "X", initials("alice-bob"));
    // 8 optimistic states exist
    check("send/recv states", typeof sendText === "function" && typeof retryMessage === "function", "");
    // 9 wrap: log has no horizontal scroll affordance
    var cs = window.getComputedStyle($("log"));
    check("log scrolls vertically", $("log") != null, "");
    // 10 keyboard: rooms listbox focusable
    check("rooms listbox focusable", $("rooms").tabIndex === 0, "");
    // 11 context menu node present
    check("context menu node", $("ctxmenu") != null && $("ctxmenu").getAttribute("role") === "menu", "");
    // 12 composer Enter/Shift+Enter handler bound (textarea present)
    check("composer textarea", $("compose") != null && $("compose").tagName === "TEXTAREA", "");
  } catch (err) {
    results.push({ name: "selftest harness", ok: false, note: String((err && err.message) || err) });
  }
  var fails = results.filter(function (x) { return !x.ok; }).length;
  var code = fails ? 1 : 0;
  out.innerHTML = "<ul>" + results.map(function (x) {
    return "<li class='" + (x.ok ? "pass" : "fail") + "'>" + (x.ok ? "PASS" : "FAIL") +
      " " + esc(x.name) + (x.note ? " — " + esc(x.note) : "") + "</li>";
  }).join("") + "</ul>" +
    "<div id='selftest-summary'><b>SELFTEST done: " + (results.length - fails) +
    " passed, " + fails + " failed (exit " + code + ")</b></div>";
  try { document.title = (code === 0 ? "SELFTEST PASS" : "SELFTEST FAIL") + " — Messages"; } catch (e) {}
  return code;
}
$("selftestbtn").addEventListener("click", runSelftest);
try {
  if (/[?&]selftest=1/.test(window.location.search || "")) runSelftest();
} catch (e) {}
window.__busSelftest = runSelftest;
</script>
