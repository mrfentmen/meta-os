[package]
name = "metaos-kernel"
version = "0.1.0"
edition = "2021"
description = "Meta OS kernel, layer 0, written in Rust. Milestone K1: boot, print on serial, halt."
license = "MIT"

[workspace]

[dependencies]
bootloader = { version = "0.9", features = ["map_physical_memory"] }

[features]
# Test-only hook (OS-024/OS-058): boot once with a forced panic to
# prove the panic screen, then boot normal builds without it.
panic-test = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
