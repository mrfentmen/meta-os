[package]
name = "metaos-kernel"
version = "0.1.0"
edition = "2021"
description = "Meta OS kernel, layer 0, written in Rust. Milestone K1: boot, print on serial, halt."
license = "MIT"

[workspace]

[dependencies]
# RK-008 (Pax KF-01 correction): the KERNEL side depends on
# `bootloader_api`, never on `bootloader` — the latter is the HOST-side
# image builder (BiosBoot/UefiBoot) and pulls std/serde, which is the
# 5,829-error wall the malformed 0.11.17 spike attempt hit. Resolves to
# 0.11.17 via kernel/Cargo.lock. Physical-memory mapping is config now
# (BOOTLOADER_CONFIG in main.rs), not a cargo feature.
bootloader_api = { version = "0.11" }

[features]
# Test-only hooks (OS-024/OS-058): boot once with a forced trap to
# prove the handler, then boot normal builds without it.
panic-test = []
break-test = []
fault-test = []
stack-test = []
guard-test = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
