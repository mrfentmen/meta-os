<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b16">
  <title>Meta Symbol | ASCII Studio</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b16;
      --panel: rgba(13, 21, 39, 0.78);
      --line: rgba(119, 169, 255, 0.17);
      --muted: #8291ac;
      --text: #edf5ff;
      --blue: #1877f2;
      --cyan: #69ddff;
      --accent: #1877f2;
      --accent-light: #78baff;
      --accent-rgb: 24, 119, 242;
    }

    * { box-sizing: border-box; }

    html, body { width: 100%; min-height: 100%; }

    body {
      margin: 0;
      min-height: 100svh;
      overflow: hidden;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% 44%, rgba(var(--accent-rgb), 0.16), transparent 38%),
        radial-gradient(ellipse at 13% 6%, rgba(var(--accent-rgb), 0.12), transparent 32%),
        radial-gradient(ellipse at 88% 92%, rgba(var(--accent-rgb), 0.07), transparent 30%),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.25;
      background-image:
        linear-gradient(rgba(133, 170, 230, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(133, 170, 230, 0.055) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at center, black 15%, transparent 80%);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      border: 1px solid rgba(151, 190, 255, 0.07);
      box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.3);
    }

    .app-shell {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      min-height: 100svh;
      padding: 30px clamp(18px, 4vw, 56px) 26px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      width: 100%;
      max-width: 1440px;
      margin: 0 auto;
      z-index: 2;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      border: 1px solid rgba(92, 174, 255, 0.34);
      border-radius: 12px;
      background: linear-gradient(145deg, rgba(24, 119, 242, 0.2), rgba(0, 209, 255, 0.06));
      box-shadow: inset 0 0 18px rgba(24, 119, 242, 0.1), 0 0 24px rgba(24, 119, 242, 0.08);
    }

    .brand-mark svg { width: 25px; height: 25px; }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--accent-light);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .brand-title {
      margin: 0;
      font-size: 14px;
      font-weight: 650;
      letter-spacing: 0.015em;
    }

    .top-meta {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(11, 20, 37, 0.55);
      color: #a8b7d0;
      font-size: 11px;
      letter-spacing: 0.06em;
      white-space: nowrap;
      backdrop-filter: blur(16px);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-light);
      box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.85);
    }

    .back-link {
      display: block;
      margin-top: 4px;
      color: var(--accent-light);
      font-size: 12px;
      text-decoration: none;
    }

    .back-link:hover,
    .back-link:focus-visible {
      text-decoration: underline;
    }

    .stage {
      position: relative;
      display: grid;
      flex: 1;
      place-items: center;
      min-height: 0;
      padding: 24px 0 32px;
    }

    .stage-glow {
      position: absolute;
      width: min(65vw, 700px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(var(--accent-rgb), 0.14), rgba(var(--accent-rgb), 0.035) 36%, transparent 68%);
      filter: blur(12px);
      pointer-events: none;
    }

    .stage-ring {
      position: absolute;
      width: min(70vw, 690px);
      aspect-ratio: 1;
      border: 1px solid rgba(var(--accent-rgb), 0.09);
      border-radius: 50%;
      transform: scaleY(0.56) rotate(-12deg);
      box-shadow: 0 0 70px rgba(var(--accent-rgb), 0.04), inset 0 0 70px rgba(var(--accent-rgb), 0.035);
      pointer-events: none;
    }

    .stage-ring::before,
    .stage-ring::after {
      content: "";
      position: absolute;
      inset: 9%;
      border: 1px solid rgba(var(--accent-rgb), 0.055);
      border-radius: 50%;
    }

    .stage-ring::after { inset: 19%; }

    #canvas-container {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      width: min(100%, 1120px);
      max-width: 100%;
      padding: 16px;
      cursor: grab;
      touch-action: none;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    #canvas-container:active { cursor: grabbing; }

    #ascii-canvas {
      display: block;
      width: 100%;
      height: auto;
      max-width: 100%;
      max-height: min(58svh, 620px);
      aspect-ratio: 1.76 / 1;
      overflow: visible;
      background: transparent;
      filter: drop-shadow(0 0 22px rgba(var(--accent-rgb), 0.14));
      transform: translateZ(0);
    }

    .hint {
      position: absolute;
      bottom: 14px;
      left: 50%;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #6f809d;
      font-size: 10px;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      transform: translateX(-50%);
      white-space: nowrap;
    }

    .hint svg { width: 13px; height: 13px; opacity: 0.8; }

    .control-dock {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      width: min(100%, 940px);
      margin: 0 auto;
      padding: 17px 20px;
      border: 1px solid rgba(119, 169, 255, 0.2);
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(18, 29, 51, 0.86), rgba(9, 17, 33, 0.88));
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.045);
      backdrop-filter: blur(22px);
    }

    .speed-control {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 11px;
      min-width: 0;
    }

    .speed-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .speed-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #dce8fb;
      font-size: 12px;
      font-weight: 600;
    }

    .speed-label svg { width: 15px; height: 15px; color: #75bfff; }

    .speed-value {
      color: var(--accent-light);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      display: block;
      width: 100%;
      height: 4px;
      margin: 0;
      border-radius: 99px;
      background: rgba(135, 164, 211, 0.2);
      accent-color: var(--accent);
      cursor: pointer;
    }

    input[type="range"]:focus-visible,
    button:focus-visible,
    #canvas-container:focus-visible {
      outline: 2px solid var(--accent-light);
      outline-offset: 4px;
    }

    .speed-scale {
      display: flex;
      justify-content: space-between;
      color: #657590;
      font-size: 9px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .dock-divider {
      width: 1px;
      align-self: stretch;
      background: rgba(119, 169, 255, 0.15);
    }

    .color-control {
      display: flex;
      flex: 1.2 1 270px;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
    }

    .color-options {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 28px;
    }

    .color-picker-button {
      position: relative;
      display: inline-grid;
      place-items: center;
      width: 29px;
      height: 29px;
      flex: 0 0 auto;
      overflow: hidden;
      border: 1px solid rgba(132, 166, 218, 0.3);
      border-radius: 9px;
      background: linear-gradient(135deg, rgba(var(--accent-rgb), 0.24), rgba(255, 255, 255, 0.045));
      color: #dbeaff;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease;
    }

    .color-picker-button:hover,
    .color-picker-button.is-active {
      border-color: var(--accent-light);
      box-shadow: 0 0 0 2px rgba(var(--accent-rgb), 0.16);
    }

    .color-picker-button svg { width: 16px; height: 16px; pointer-events: none; }

    .color-picker-button input[type="color"] {
      position: absolute;
      inset: -5px;
      width: calc(100% + 10px);
      height: calc(100% + 10px);
      padding: 0;
      border: 0;
      opacity: 0;
      cursor: pointer;
    }

    .color-swatch {
      width: 22px;
      height: 22px;
      min-height: 0;
      flex: 0 0 auto;
      padding: 0;
      border: 2px solid transparent;
      border-radius: 50%;
      background: var(--swatch);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.24), 0 0 0 1px rgba(0, 0, 0, 0.2);
      transition: transform 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
    }

    .color-swatch:hover { transform: translateY(-1px) scale(1.08); }

    .color-swatch.is-selected {
      border-color: #f5f9ff;
      box-shadow: 0 0 0 2px rgba(var(--accent-rgb), 0.28), inset 0 0 0 1px rgba(0, 0, 0, 0.24);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      padding: 0 13px;
      border: 1px solid rgba(132, 166, 218, 0.2);
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.035);
      color: #cfdbef;
      font: inherit;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
      white-space: nowrap;
    }

    button svg { width: 14px; height: 14px; }
    button:hover { border-color: rgba(105, 191, 255, 0.48); background: rgba(58, 133, 230, 0.1); }
    button:active { transform: translateY(1px); }

    .primary-action {
      border-color: rgba(73, 164, 255, 0.38);
      background: linear-gradient(135deg, rgba(24, 119, 242, 0.24), rgba(29, 167, 255, 0.12));
      color: #e8f5ff;
    }

    .footer-note {
      position: absolute;
      right: clamp(18px, 4vw, 56px);
      bottom: 34px;
      color: #52617a;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 9px;
      letter-spacing: 0.08em;
    }

    @media (max-width: 620px) {
      .app-shell { padding: 20px 16px 18px; }
      .brand-mark { width: 34px; height: 34px; border-radius: 10px; }
      .brand-title { font-size: 12px; }
      .eyebrow { font-size: 9px; }
      .top-meta { padding: 8px 10px; font-size: 9px; }
      .stage { padding: 12px 0 26px; }
      #canvas-container { padding: 8px 0; }
      #ascii-canvas { max-height: 48svh; }
      .stage-ring { width: 95vw; }
      .stage-glow { width: 90vw; }
      .control-dock { flex-wrap: wrap; gap: 14px; padding: 14px; border-radius: 15px; }
      .speed-control { flex: 1 1 175px; }
      .color-control { flex: 1 1 250px; }
      .color-options { gap: 7px; }
      .dock-divider { display: none; }
      .actions { gap: 6px; margin-left: auto; }
      button { min-height: 38px; padding: 0 10px; }
      .button-text { display: none; }
      .footer-note { display: none; }
    }

    @media (max-height: 600px) {
      .app-shell { padding-top: 16px; padding-bottom: 14px; }
      .brand-mark { width: 30px; height: 30px; }
      .stage { padding: 5px 0 18px; }
      #ascii-canvas { max-height: 52svh; }
      .control-dock { padding: 12px 16px; }
      .hint { bottom: 4px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none">
            <path d="M7 28.7C10.8 35.3 16.8 35.2 22.1 27.3L28.7 17.1C34.2 8.7 40.4 13.4 41 19.1C41.4 22.6 39.5 26.9 36.8 31.2" stroke="#65D5FF" stroke-width="4.3" stroke-linecap="round"/>
            <path d="M6.7 19.3C7.2 13.5 13.7 8.5 19.1 17.1L25.7 27.3C31 35.2 37 35.3 40.8 28.7" stroke="#3288FF" stroke-width="4.3" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <p class="eyebrow">Interactive object / 001</p>
          <h1 class="brand-title">Meta Loop <span style="color:#7487a5;font-weight:450">/ ASCII Studio</span></h1>
          <a class="back-link" href="../index.html">← Back to console</a>
        </div>
      </div>
      <div class="top-meta" aria-live="polite">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-label">LIVE RENDER</span>
      </div>
    </header>

    <section class="stage" aria-label="Interactive rotating ASCII interpretation of the Meta loop symbol">
      <div class="stage-glow" aria-hidden="true"></div>
      <div class="stage-ring" aria-hidden="true"></div>
      <div id="canvas-container" tabindex="0" role="application" aria-label="Interactive three dimensional ASCII ribbon. Drag or use the arrow keys to rotate it. Press Space to pause or resume.">
        <canvas id="ascii-canvas" width="1200" height="680" role="img" aria-label="A three dimensional Meta-inspired infinity ribbon built from colored ASCII characters. Drag to rotate. Use arrow keys to rotate and Space to pause or resume."></canvas>
      </div>
      <div class="hint" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12V6a2 2 0 0 1 4 0v5-7a2 2 0 0 1 4 0v8-5a2 2 0 0 1 4 0v8a7 7 0 0 1-7 7h-1a7 7 0 0 1-5-2l-3-3a2 2 0 0 1 3-3l2 2"/></svg>
        Drag to rotate · Explore the form
      </div>
    </section>

    <section class="control-dock" aria-label="Animation controls">
      <div class="speed-control">
        <div class="speed-heading">
          <label class="speed-label" for="speed">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            Rotation speed
          </label>
          <output class="speed-value" id="speed-value" for="speed">30%</output>
        </div>
        <input type="range" id="speed" min="0" max="100" value="30" aria-label="Rotation speed">
        <div class="speed-scale"><span>Still</span><span>Slow</span><span>Fast</span></div>
      </div>
      <div class="dock-divider" aria-hidden="true"></div>
      <div class="color-control" aria-label="Logo color controls">
        <div class="speed-heading">
          <label class="speed-label" for="color-picker">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-1.1-.9-2-2-2h-1.5a1.5 1.5 0 0 1-1.2-2.4A2 2 0 0 0 14.7 4H12Z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7.5" r="1"/><circle cx="6.8" cy="15" r="1"/></svg>
            Logo color
          </label>
          <output class="speed-value" id="color-value">#1877F2</output>
        </div>
        <div class="color-options">
          <label class="color-picker-button" id="color-picker-button" title="Choose a custom color" aria-label="Choose a custom logo color">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 6 4 4M4 20l4.3-1 10.9-10.9a2.1 2.1 0 0 0-3-3L5.3 16 4 20Z"/><path d="m4 20 4-1"/></svg>
            <input type="color" id="color-picker" value="#1877f2" aria-label="Choose custom logo color">
          </label>
          <button class="color-swatch is-selected" type="button" data-color="#1877f2" style="--swatch:#1877f2" aria-label="Meta blue" title="Meta blue" aria-pressed="true"></button>
          <button class="color-swatch" type="button" data-color="#00c8ff" style="--swatch:#00c8ff" aria-label="Cyan" title="Cyan" aria-pressed="false"></button>
          <button class="color-swatch" type="button" data-color="#8b5cf6" style="--swatch:#8b5cf6" aria-label="Violet" title="Violet" aria-pressed="false"></button>
          <button class="color-swatch" type="button" data-color="#ff4f9a" style="--swatch:#ff4f9a" aria-label="Pink" title="Pink" aria-pressed="false"></button>
          <button class="color-swatch" type="button" data-color="#20d6a3" style="--swatch:#20d6a3" aria-label="Emerald" title="Emerald" aria-pressed="false"></button>
          <button class="color-swatch" type="button" data-color="#ffbd4a" style="--swatch:#ffbd4a" aria-label="Gold" title="Gold" aria-pressed="false"></button>
        </div>
      </div>
      <div class="dock-divider" aria-hidden="true"></div>
      <div class="actions">
        <button class="primary-action" id="pause-button" type="button" aria-pressed="false">
          <svg id="pause-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 5v14M16 5v14"/></svg>
          <span class="button-text" id="pause-label">Pause</span>
        </button>
        <button id="reset-button" type="button" aria-label="Reset rotation" title="Reset rotation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5"/></svg>
          <span class="button-text">Reset</span>
        </button>
      </div>
    </section>
    <div class="footer-note" aria-hidden="true">124 × 52 CHARACTER FIELD</div>
  </main>

  <script>
    const canvas = document.getElementById('ascii-canvas');
    const scene = document.getElementById('canvas-container');
    const speedSlider = document.getElementById('speed');
    const speedValue = document.getElementById('speed-value');
    const pauseButton = document.getElementById('pause-button');
    const pauseLabel = document.getElementById('pause-label');
    const pauseIcon = document.getElementById('pause-icon');
    const statusLabel = document.getElementById('status-label');
    const statusDot = document.getElementById('status-dot');
    const ctx = canvas.getContext('2d', { alpha: true, desynchronized: true });

    // STUDIO-PERSIST (Del direction Oct 30; Hana Agent1): this studio
    // shares the console Logo panel's storage keys
    // (meta-trio-logo-color, meta-trio-logo-speed,
    // meta-trio-logo-paused), so a choice made in the console
    // carries into the studio and a choice made here carries back.
    // Nothing saved means the studio keeps its own defaults (Meta
    // blue, 30%, playing); an invalid saved value is ignored, never
    // trusted. A failed store leaves the page working in memory for
    // this visit only, the console's pattern.
    const LOGO_COLOR_KEY = 'meta-trio-logo-color';
    const LOGO_SPEED_KEY = 'meta-trio-logo-speed';
    const LOGO_PAUSED_KEY = 'meta-trio-logo-paused';
    function readStored(key) {
      try { return window.localStorage && window.localStorage.getItem(key); }
      catch (e) { return null; }
    }
    function saveStored(key, value) {
      try { if (window.localStorage) window.localStorage.setItem(key, value); }
      catch (e) { /* Store unavailable: this visit only. */ }
    }
    function storedColor() {
      const value = readStored(LOGO_COLOR_KEY);
      return /^#[0-9a-f]{6}$/i.test(value || '') ? value.toLowerCase() : null;
    }
    function storedSpeed() {
      const parsed = Number(readStored(LOGO_SPEED_KEY));
      return Number.isFinite(parsed) ? Math.max(0, Math.min(100, Math.round(parsed))) : null;
    }
    function storedPaused() { return readStored(LOGO_PAUSED_KEY) === '1'; }

    // A wide ASCII grid creates a cleaner silhouette without losing the character-art look.
    const WIDTH = 124;
    const HEIGHT = 52;
    const RING_POINTS = 320;
    const TUBE_POINTS = 48;
    const CAMERA_DISTANCE = 80;
    const LOOP_X = 24.5;
    const LOOP_Y = 26.5;
    const LOOP_Z = 8.2;
    const RIBBON_WIDTH = 3.65;
    const RIBBON_THICKNESS = 0.72;
    const X_PROJECTION = 0.99;
    const Y_PROJECTION = 1.76;
    const GLYPHS = ' .,:;irsXA253hMHGS#9B&@';
    const DEFAULT_ACCENT = '#1877f2';
    const colorPicker = document.getElementById('color-picker');
    const colorValue = document.getElementById('color-value');
    const colorPickerButton = document.getElementById('color-picker-button');
    const colorSwatches = [...document.querySelectorAll('.color-swatch')];
    let PALETTE = buildPalette(DEFAULT_ACCENT);
    let accentRgb = hexToRgb(DEFAULT_ACCENT);
    let specularColor = mixHex(DEFAULT_ACCENT, '#ffffff', 0.9);
    const CELL_COUNT = WIDTH * HEIGHT;
    const glyphBuffer = new Uint8Array(CELL_COUNT);
    const colorBuffer = new Uint8Array(CELL_COUNT);
    const specBuffer = new Float32Array(CELL_COUNT);
    const zBuffer = new Float32Array(CELL_COUNT);

    let angleX = -0.045;
    let angleY = 0.045;
    let isDragging = false;
    let isPaused = false;
    let lastPointer = { x: 0, y: 0 };
    let dragVelocityX = 0;
    let dragVelocityY = 0;
    let previousFrameTime = 0;
    let viewWidth = 0;
    let viewHeight = 0;
    let pixelRatio = 1;

    const lightDirection = normalize({ x: -0.38, y: 0.62, z: 0.91 });
    const viewDirection = { x: 0, y: 0, z: 1 };
    const halfVector = normalize({
      x: lightDirection.x + viewDirection.x,
      y: lightDirection.y + viewDirection.y,
      z: lightDirection.z + viewDirection.z
    });

    function normalize(v) {
      const length = Math.hypot(v.x, v.y, v.z) || 1;
      return { x: v.x / length, y: v.y / length, z: v.z / length };
    }

    // A custom, slightly asymmetric infinity path inspired by Meta's continuous loop.
    // The depth offset separates the two strands at the central crossover.
    function loopPoint(u) {
      const s = Math.sin(u);
      const c = Math.cos(u);
      return {
        x: LOOP_X * s * (1 + 0.018 * s),
        y: LOOP_Y * s * c * (1 + 0.025 * s),
        z: LOOP_Z * c + 0.65 * Math.sin(2 * u)
      };
    }

    // Build an actual ribbon panel instead of a round pipe. The face samples fill
    // the broad surface, while separate edge samples create a softly rounded rim.
    function buildSurface() {
      const samples = [];
      const frameStep = 0.0025;
      const WIDTH_STEPS = 24;
      const EDGE_STEPS = 9;

      for (let j = 0; j < RING_POINTS; j++) {
        const u = (j / RING_POINTS) * Math.PI * 2;
        const center = loopPoint(u);
        const before = loopPoint(u - frameStep);
        const after = loopPoint(u + frameStep);
        const tangent = normalize({
          x: after.x - before.x,
          y: after.y - before.y,
          z: after.z - before.z
        });

        let nx = -tangent.y;
        let ny = tangent.x;
        let nz = 0;
        const nLength = Math.hypot(nx, ny, nz) || 1;
        nx /= nLength;
        ny /= nLength;
        nz /= nLength;

        const binormal = normalize({
          x: tangent.y * nz - tangent.z * ny,
          y: tangent.z * nx - tangent.x * nz,
          z: tangent.x * ny - tangent.y * nx
        });
        const localWidth = RIBBON_WIDTH * (0.90 + 0.10 * Math.pow(Math.abs(Math.sin(u)), 1.15));

        // Sample both sides of the broad ribbon face across its full width.
        for (let k = 0; k <= WIDTH_STEPS; k++) {
          const across = -1 + (2 * k / WIDTH_STEPS);
          const crown = 1 - 0.045 * across * across;
          for (const side of [-1, 1]) {
            const x = center.x + localWidth * across * nx + side * RIBBON_THICKNESS * crown * binormal.x;
            const y = center.y + localWidth * across * ny + side * RIBBON_THICKNESS * crown * binormal.y;
            const z = center.z + localWidth * across * nz + side * RIBBON_THICKNESS * crown * binormal.z;
            const faceNormal = normalize({
              x: side * binormal.x - 0.09 * across * nx,
              y: side * binormal.y - 0.09 * across * ny,
              z: side * binormal.z - 0.09 * across * nz
            });
            samples.push({
              x, y, z,
              nx: faceNormal.x,
              ny: faceNormal.y,
              nz: faceNormal.z,
              u,
              colorWave: 0.5 + 0.5 * Math.sin(u + 0.65)
            });
          }
        }

        // Rounded side rails keep the ribbon dimensional when viewed edge-on.
        for (const edgeSide of [-1, 1]) {
          for (let e = 0; e < EDGE_STEPS; e++) {
            const theta = -Math.PI / 2 + Math.PI * e / (EDGE_STEPS - 1);
            const st = Math.sin(theta);
            const ct = Math.cos(theta);
            const x = center.x + localWidth * edgeSide * nx + RIBBON_THICKNESS * st * binormal.x;
            const y = center.y + localWidth * edgeSide * ny + RIBBON_THICKNESS * st * binormal.y;
            const z = center.z + localWidth * edgeSide * nz + RIBBON_THICKNESS * st * binormal.z;
            const edgeNormal = normalize({
              x: edgeSide * ct * nx + st * binormal.x,
              y: edgeSide * ct * ny + st * binormal.y,
              z: edgeSide * ct * nz + st * binormal.z
            });
            samples.push({
              x, y, z,
              nx: edgeNormal.x,
              ny: edgeNormal.y,
              nz: edgeNormal.z,
              u,
              colorWave: 0.5 + 0.5 * Math.sin(u + 0.65)
            });
          }
        }
      }
      return samples;
    }

    const surfaceSamples = buildSurface();

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      const nextRatio = Math.min(window.devicePixelRatio || 1, 2);
      const pixelWidth = Math.round(rect.width * nextRatio);
      const pixelHeight = Math.round(rect.height * nextRatio);

      if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
        canvas.width = pixelWidth;
        canvas.height = pixelHeight;
        ctx.setTransform(nextRatio, 0, 0, nextRatio, 0, 0);
        ctx.imageSmoothingEnabled = true;
      }

      pixelRatio = nextRatio;
      viewWidth = rect.width;
      viewHeight = rect.height;
    }

    if ('ResizeObserver' in window) {
      new ResizeObserver(resizeCanvas).observe(canvas);
    }
    window.addEventListener('resize', resizeCanvas, { passive: true });

    function resetRotation() {
      angleX = -0.045;
      angleY = 0.045;
      dragVelocityX = 0;
      dragVelocityY = 0;
    }

    function setPaused(nextPaused) {
      isPaused = nextPaused;
      pauseButton.setAttribute('aria-pressed', String(isPaused));
      pauseLabel.textContent = isPaused ? 'Resume' : 'Pause';
      pauseIcon.innerHTML = isPaused
        ? '<path d="m8 5 11 7-11 7z" fill="currentColor" stroke="none"/>'
        : '<path d="M8 5v14M16 5v14"/>';
      statusLabel.textContent = isPaused ? 'RENDER PAUSED' : 'LIVE RENDER';
      statusDot.style.background = isPaused ? '#6f809d' : mixHex(colorPicker.value, '#ffffff', 0.42);
      statusDot.style.boxShadow = isPaused ? 'none' : `0 0 10px rgba(${accentRgb.r}, ${accentRgb.g}, ${accentRgb.b}, 0.85)`;
    }

    speedSlider.addEventListener('input', () => {
      speedValue.textContent = `${speedSlider.value}%`;
      saveStored(LOGO_SPEED_KEY, speedSlider.value);
    });

    pauseButton.addEventListener('click', () => {
      setPaused(!isPaused);
      saveStored(LOGO_PAUSED_KEY, isPaused ? '1' : '0');
    });
    document.getElementById('reset-button').addEventListener('click', () => {
      resetRotation();
      setPaused(false);
      saveStored(LOGO_PAUSED_KEY, '0');
    });

    scene.addEventListener('pointerdown', (event) => {
      if (event.pointerType === 'mouse' && event.button !== 0) return;
      isDragging = true;
      dragVelocityX = 0;
      dragVelocityY = 0;
      lastPointer = { x: event.clientX, y: event.clientY };
      scene.setPointerCapture(event.pointerId);
      scene.focus({ preventScroll: true });
    });

    scene.addEventListener('pointermove', (event) => {
      if (!isDragging) return;
      const dx = event.clientX - lastPointer.x;
      const dy = event.clientY - lastPointer.y;
      angleY += dx * 0.008;
      angleX += dy * 0.008;
      dragVelocityY = dx * 0.0017;
      dragVelocityX = dy * 0.0017;
      lastPointer = { x: event.clientX, y: event.clientY };
    });

    function stopDragging() { isDragging = false; }
    scene.addEventListener('pointerup', stopDragging);
    scene.addEventListener('pointercancel', stopDragging);
    scene.addEventListener('lostpointercapture', stopDragging);

    scene.addEventListener('keydown', (event) => {
      const step = event.shiftKey ? 0.18 : 0.08;
      if (event.key === 'ArrowLeft') { angleY -= step; event.preventDefault(); }
      else if (event.key === 'ArrowRight') { angleY += step; event.preventDefault(); }
      else if (event.key === 'ArrowUp') { angleX -= step; event.preventDefault(); }
      else if (event.key === 'ArrowDown') { angleX += step; event.preventDefault(); }
      else if (event.code === 'Space') { setPaused(!isPaused); saveStored(LOGO_PAUSED_KEY, isPaused ? '1' : '0'); event.preventDefault(); }
    });

    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

    function hexToRgb(hex) {
      const clean = String(hex).replace('#', '');
      return {
        r: parseInt(clean.slice(0, 2), 16),
        g: parseInt(clean.slice(2, 4), 16),
        b: parseInt(clean.slice(4, 6), 16)
      };
    }

    function rgbToHex({ r, g, b }) {
      return '#' + [r, g, b].map(value => Math.round(value).toString(16).padStart(2, '0')).join('');
    }

    function mixHex(firstHex, secondHex, amountSecond) {
      const a = hexToRgb(firstHex);
      const b = hexToRgb(secondHex);
      return rgbToHex({
        r: a.r + (b.r - a.r) * amountSecond,
        g: a.g + (b.g - a.g) * amountSecond,
        b: a.b + (b.b - a.b) * amountSecond
      });
    }

    function buildPalette(baseHex) {
      // The exact selected color anchors the gradient. Shadows are mixed toward
      // black while highlights are mixed toward white, preserving the chosen hue.
      return [
        mixHex(baseHex, '#020817', 0.88),
        mixHex(baseHex, '#020817', 0.72),
        mixHex(baseHex, '#020817', 0.53),
        mixHex(baseHex, '#020817', 0.31),
        baseHex,
        mixHex(baseHex, '#ffffff', 0.18),
        mixHex(baseHex, '#ffffff', 0.38),
        mixHex(baseHex, '#ffffff', 0.62),
        mixHex(baseHex, '#ffffff', 0.9)
      ];
    }

    function setAccentColor(hex) {
      if (!/^#[0-9a-f]{6}$/i.test(hex)) return;
      const normalized = hex.toLowerCase();
      accentRgb = hexToRgb(normalized);
      PALETTE = buildPalette(normalized);
      specularColor = mixHex(normalized, '#ffffff', 0.9);

      const root = document.documentElement;
      root.style.setProperty('--accent', normalized);
      root.style.setProperty('--accent-rgb', `${accentRgb.r}, ${accentRgb.g}, ${accentRgb.b}`);
      root.style.setProperty('--accent-light', mixHex(normalized, '#ffffff', 0.42));
      colorValue.textContent = normalized.toUpperCase();
      colorPicker.value = normalized;

      const isPreset = colorSwatches.some(swatch => swatch.dataset.color.toLowerCase() === normalized);
      colorSwatches.forEach(swatch => {
        const selected = swatch.dataset.color.toLowerCase() === normalized;
        swatch.classList.toggle('is-selected', selected);
        swatch.setAttribute('aria-pressed', String(selected));
      });
      colorPickerButton.classList.toggle('is-active', !isPreset);
      colorPickerButton.title = isPreset ? 'Choose a custom color' : `Custom color ${normalized.toUpperCase()}`;

      // Keep the studio mark in sync with the selected palette.
      const markPaths = document.querySelectorAll('.brand-mark path');
      if (markPaths[0]) markPaths[0].setAttribute('stroke', mixHex(normalized, '#ffffff', 0.36));
      if (markPaths[1]) markPaths[1].setAttribute('stroke', normalized);
      statusDot.style.background = isPaused ? '#6f809d' : mixHex(normalized, '#ffffff', 0.42);
      statusDot.style.boxShadow = isPaused ? 'none' : `0 0 10px rgba(${accentRgb.r}, ${accentRgb.g}, ${accentRgb.b}, 0.85)`;
    }

    colorPicker.addEventListener('input', event => {
      setAccentColor(event.target.value);
      saveStored(LOGO_COLOR_KEY, colorPicker.value);
    });
    colorSwatches.forEach(swatch => {
      swatch.addEventListener('click', () => {
        setAccentColor(swatch.dataset.color);
        saveStored(LOGO_COLOR_KEY, colorPicker.value);
      });
    });

    function renderFrame(timestamp = 0) {
      if (!viewWidth || !viewHeight) resizeCanvas();
      if (!viewWidth || !viewHeight) {
        requestAnimationFrame(renderFrame);
        return;
      }

      const frameScale = previousFrameTime
        ? Math.min((timestamp - previousFrameTime) / (1000 / 60), 3)
        : 1;
      previousFrameTime = timestamp;

      if (!isDragging && !isPaused) {
        angleY += Number(speedSlider.value) * 0.0003 * frameScale;
        angleX += dragVelocityX * frameScale;
        angleY += dragVelocityY * frameScale;
        const damping = Math.pow(0.90, frameScale);
        dragVelocityX *= damping;
        dragVelocityY *= damping;
        if (Math.abs(dragVelocityX) < 0.00008) dragVelocityX = 0;
        if (Math.abs(dragVelocityY) < 0.00008) dragVelocityY = 0;
      }

      glyphBuffer.fill(0);
      colorBuffer.fill(0);
      specBuffer.fill(0);
      zBuffer.fill(-Infinity);

      const cosY = Math.cos(angleY);
      const sinY = Math.sin(angleY);
      const cosX = Math.cos(angleX);
      const sinX = Math.sin(angleX);

      for (let i = 0; i < surfaceSamples.length; i++) {
        const p = surfaceSamples[i];

        // Rotate positions and the associated normals with the same transform.
        const x1 = p.x * cosY + p.z * sinY;
        const z1 = -p.x * sinY + p.z * cosY;
        const nx1 = p.nx * cosY + p.nz * sinY;
        const nz1 = -p.nx * sinY + p.nz * cosY;
        const y2 = p.y * cosX - z1 * sinX;
        const z2 = p.y * sinX + z1 * cosX;
        const nx2 = nx1;
        const ny2 = p.ny * cosX - nz1 * sinX;
        const nz2 = p.ny * sinX + nz1 * cosX;

        const depth = CAMERA_DISTANCE - z2;
        if (depth <= 1) continue;
        const invDepth = 1 / depth;
        const xp = Math.round(WIDTH / 2 + x1 * invDepth * WIDTH * X_PROJECTION);
        const yp = Math.round(HEIGHT / 2 - y2 * invDepth * HEIGHT * Y_PROJECTION);
        if (xp < 0 || xp >= WIDTH || yp < 0 || yp >= HEIGHT) continue;

        const index = xp + yp * WIDTH;
        if (invDepth <= zBuffer[index]) continue;

        const diffuse = Math.max(0, nx2 * lightDirection.x + ny2 * lightDirection.y + nz2 * lightDirection.z);
        const halfDot = Math.max(0, nx2 * halfVector.x + ny2 * halfVector.y + nz2 * halfVector.z);
        const specular = Math.pow(halfDot, 28);
        const rimBase = 1 - Math.min(1, Math.abs(nz2));
        const rim = rimBase * rimBase;
        const colorWave = p.colorWave;

        const glyphBrightness = clamp(0.13 + diffuse * 0.43 + specular * 0.92 + rim * 0.18, 0, 1);
        const glyphIndex = clamp(Math.round(glyphBrightness * (GLYPHS.length - 1)), 1, GLYPHS.length - 1);
        const colorBrightness = clamp(0.12 + diffuse * 0.48 + specular * 0.73 + rim * 0.13 + colorWave * 0.10, 0, 1);
        const colorIndex = clamp(Math.round(colorBrightness * (PALETTE.length - 1)), 0, PALETTE.length - 1);

        zBuffer[index] = invDepth;
        glyphBuffer[index] = glyphIndex;
        colorBuffer[index] = colorIndex;
        specBuffer[index] = specular;
      }

      // Soft blue aura behind the characters, kept subtle so the glyphs remain crisp.
      ctx.clearRect(0, 0, viewWidth, viewHeight);
      const aura = ctx.createRadialGradient(
        viewWidth * 0.5, viewHeight * 0.52, viewHeight * 0.02,
        viewWidth * 0.5, viewHeight * 0.52, viewWidth * 0.43
      );
      aura.addColorStop(0, `rgba(${accentRgb.r}, ${accentRgb.g}, ${accentRgb.b}, 0.115)`);
      aura.addColorStop(0.42, `rgba(${accentRgb.r}, ${accentRgb.g}, ${accentRgb.b}, 0.035)`);
      aura.addColorStop(1, `rgba(${accentRgb.r}, ${accentRgb.g}, ${accentRgb.b}, 0)`);
      ctx.fillStyle = aura;
      ctx.fillRect(0, 0, viewWidth, viewHeight);

      const cellWidth = viewWidth / WIDTH;
      const cellHeight = viewHeight / HEIGHT;
      const fontSize = Math.min(cellHeight * 1.01, cellWidth / 0.59);
      ctx.font = `700 ${fontSize}px "SFMono-Regular", Consolas, "Liberation Mono", monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Main pass: each character receives its own light-dependent blue or cyan tone.
      for (let i = 0; i < CELL_COUNT; i++) {
        const glyphIndex = glyphBuffer[i];
        if (!glyphIndex) continue;
        const character = GLYPHS[glyphIndex];
        if (character === ' ') continue;
        const x = ((i % WIDTH) + 0.5) * cellWidth;
        const y = (Math.floor(i / WIDTH) + 0.5) * cellHeight;
        ctx.fillStyle = PALETTE[colorBuffer[i]];
        ctx.fillText(character, x, y);
      }

      // Specular pass: small bright glints sell the polished ribbon surface.
      ctx.shadowColor = `rgba(${accentRgb.r}, ${accentRgb.g}, ${accentRgb.b}, 0.9)`;
      ctx.shadowBlur = cellHeight * 0.85;
      ctx.fillStyle = specularColor;
      for (let i = 0; i < CELL_COUNT; i++) {
        if (specBuffer[i] < 0.66 || !glyphBuffer[i]) continue;
        const character = GLYPHS[glyphBuffer[i]];
        if (character === ' ') continue;
        const x = ((i % WIDTH) + 0.5) * cellWidth;
        const y = (Math.floor(i / WIDTH) + 0.5) * cellHeight;
        ctx.fillText(character, x, y);
      }
      ctx.shadowBlur = 0;

      requestAnimationFrame(renderFrame);
    }

    // Restore the console's saved choices before the first frame, so
    // the studio never flashes its defaults over a saved choice.
    const savedColor = storedColor();
    setAccentColor(savedColor || DEFAULT_ACCENT);
    const savedSpeed = storedSpeed();
    if (savedSpeed !== null) {
      speedSlider.value = String(savedSpeed);
      speedValue.textContent = `${savedSpeed}%`;
    }
    if (storedPaused()) setPaused(true);
    resizeCanvas();
    renderFrame();
  </script>
</body>
</html>
