# CI for the Meta Trio stack: Node + Python only.
# No cargo/Rust here — the Rust crates are UNCOMPILED by convention
# (TASKS.md shared rules); a red Rust gate would be worse than none.
name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Node suite
        id: node-suite
        # Baseline-enforced (OC2 gate fix 2026-11-03): exits 1 ONLY on a
        # failure NOT in verify/npm-baseline.txt (56 pre-existing
        # native/Swift-parity failures, listed by name, owned by the
        # native/web parity lanes). New breakage fails the gate;
        # baseline members that get fixed are reported, not failed.
        run: node verify/npm-gate.mjs

      - name: Python queue suite
        run: python3 -m unittest discover -s tests/queue-python

      - name: Repo readiness check
        id: readiness
        # Baseline-enforced like the Node step (check.mjs shares
        # verify/npm-baseline.txt; secret-scan hits were fixed 2026-11-03).
        # continue-on-error stays as belt-and-braces: a red readiness must
        # never block the merge queue by itself — the Node step is the
        # enforcer. Last verified: 5/5 passing.
        continue-on-error: true
        run: node verify/check.mjs
