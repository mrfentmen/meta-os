<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MetaOS — Start</title>
<style>
  :root { --ink: #0d1117; --panel: #161b22; --text: #f5f7fa; --dim: #9fb0c3; --accent: #3b82f6; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ink); color: var(--text);
    font: 16px/1.5 "DejaVu Sans", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  main { width: min(680px, 100%); }
  h1 { margin: 0; font-size: 40px; letter-spacing: 0.5px; }
  .sub { margin: 6px 0 28px; color: var(--dim); }
  .search { display: flex; gap: 8px; }
  .search input {
    flex: 1; padding: 12px 14px; border-radius: 8px; border: 1px solid #263041;
    background: var(--panel); color: var(--text); font-size: 15px;
  }
  .search button {
    padding: 12px 20px; border: 0; border-radius: 8px; cursor: pointer;
    background: var(--accent); color: #0b0f14; font-weight: 700; font-size: 15px;
  }
  .search input:focus, .search button:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
  .keys { margin-top: 32px; border-top: 1px solid #263041; padding-top: 20px; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); margin: 0 0 12px; }
  ul { margin: 0; padding-left: 18px; }
  li { margin: 6px 0; }
  code { background: var(--panel); padding: 1px 6px; border-radius: 4px; }
</style>
</head>
<body>
<main>
  <h1>MetaOS</h1>
  <p class="sub">1.0 — this page is on the disk, so it works with no network.</p>

  <form class="search" action="https://duckduckgo.com/" method="get">
    <input type="search" name="q" placeholder="Search the web (needs a network)" aria-label="Search the web">
    <button type="submit">Search</button>
  </form>

  <section class="keys">
    <h2>Where things are</h2>
    <ul>
      <li><b>Files</b> — your home is <code>/home/&lt;you&gt;</code>.</li>
      <li><b>Terminal</b> — in the dock, bottom of the screen.</li>
      <li><b>Settings</b> — the gear in the dock.</li>
      <li><b>Install</b> — the installer icon on the desktop.</li>
    </ul>
  </section>
</main>
</body>
</html>
