# MetaOS boot menu. Installed to /etc/default/grub.d/metaos-theme.cfg, where
# the base image's /etc/default/grub sources it. Nothing else is overridden:
# the kernel command line stays whatever the base image or the installer set.
GRUB_THEME="/boot/grub/themes/metaos/theme.txt"
GRUB_TIMEOUT_STYLE=menu
GRUB_TIMEOUT=5
