---
# MetaOS Calamares settings (Buffy lane, H+8).
# Preseeded: the install runs with no questions it can answer itself.
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
  - id: metaos-partition
    module: partition
    config: partition.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - bootloader-config
      - grubcfg
      - bootloader
      - umount
      - finished

branding: meta
prompt-install: false
dont-chroot: false
oem-setup: false
