---
# One human account, no root password (sudo instead), no autologin: the
# plan's acceptance line is "reboots into the login screen", so autologin
# would prove the wrong thing.
user:
  shell: /bin/bash
  groups:
    - users
    - lpadmin
    - sudo
  autologinGroup: autologin
  doAutologin: false

setRootPassword: false
doReusePassword: true
allowWeakPasswords: false

passwordRequirements:
  minLength: 12
  maxLength: 64
