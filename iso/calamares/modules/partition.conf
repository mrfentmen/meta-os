---
# Preseeded clean install: wipe the chosen disk, one ext4 root, no swap.
# The H+8 proof is a clean install to a fresh disk, start to finish, so the
# partitioning choice is made here and not asked at the partition page.
efiSystemPartition: /boot/efi
userSwapChoices:
  - none
ensureSuspendToDisk: false
drawNestedPartitions: false
alwaysShowPartitionLabels: true
defaultFileSystemType: ext4
initialPartitioningChoice: erase
initialSwapChoice: none
