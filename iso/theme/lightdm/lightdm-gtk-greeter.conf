# MetaOS login screen. Installed to /etc/lightdm/lightdm-gtk-greeter.conf.
# The wallpaper is the same ring as the splash and the desktop, drawn dimmer
# so the name and password fields stay readable.
[greeter]
background=/usr/share/metaos/theme/greeter-wallpaper.png
theme-name=MetaOS
icon-theme-name=Adwaita
font-name=Inter 10
xft-antialias=true
xft-hintstyle=hintslight
xft-rgba=rgb
