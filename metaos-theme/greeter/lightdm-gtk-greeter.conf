# MetaOS 1.0 greeter (lightdm-gtk-greeter — ships in the base image). Install: /etc/lightdm/lightdm-gtk-greeter.conf
# Background + avatar mark installed by the theme stack: /usr/share/backgrounds/meta-ascii.png, meta-m.png
[greeter]
background=/usr/share/backgrounds/meta-ascii.png
theme-name=MetaOS
icon-theme-name=MetaOS
font-name=Inter 11
default-user-image=/usr/share/backgrounds/meta-m.png
clock-format=%A %H:%M
indicators=~host;~spacer;~clock;~spacer;~session;~power
