# MetaOS 1.0 greeter (slick-greeter). Install: /etc/lightdm/slick-greeter.conf
# Background installed by Hana's package step: /usr/share/backgrounds/meta-rays.png
[Greeter]
background=/usr/share/backgrounds/meta-rays.png
theme-name=MetaOS
icon-theme-name=MetaOS
font-name=Inter 11
draw-grid=false
show-hostname=false
show-keyboard-layout=false
show-a11y=false
show-power=false
logo=
other-monitors-logo=
background-color=#070B16
draw-user-backgrounds=false
