# MetaOS 1.0 -- bootloader install.
#
# GRUB for both firmware paths: EFI via grub-install + efibootmgr, BIOS via
# the same grub-install. installEFIFallback writes the removable-media
# fallback path (EFI/BOOT/BOOTX64.EFI) so the installed disk also boots in
# firmware that has no NVRAM entry -- the failure mode that bit the first
# QEMU install test on the bench.
---
efiBootLoader: "grub"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
installEFIFallback: true
