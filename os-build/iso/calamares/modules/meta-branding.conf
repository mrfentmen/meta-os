# MetaOS 1.0 -- the one Meta-only Calamares instance (shellprocess).
#
# Runs INSIDE the target chroot after unpackfs + bootloader, so it edits the
# installed system, not the live session. dontChroot: false is the whole
# point; flipping it would brand the live ISO a second time and leave the
# target unbranded.
---
dontChroot: false
timeout: 300
script:
    - "/usr/local/lib/metaos/meta-branding.sh"
