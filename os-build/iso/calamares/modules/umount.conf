# MetaOS 1.0 -- unmount the target at the end of the install.
#
# Upstream src/modules/umount/umount.conf in full: `emergency: true`.
# The module is last in the exec sequence ("After this, there is no regular
# way to modify the target system anymore"); emergency:true makes it run
# even when a prior module fails, so a failed install never leaves the
# target partitions mounted on the live session.
---
emergency: true
