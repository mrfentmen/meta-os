# MetaOS 1.0 -- where the installed system comes from.
#
# Ubuntu live media mounts the ISO at /cdrom and the classic layout ships
# the root filesystem as casper/filesystem.squashfs. The whole Meta
# provisioning (splash theme, Calamares config, release file) is already
# inside that squashfs, so this single unpack copies it to the target; there
# is no second payload.
#
# MEASURED WARNING: the reference base xubuntu-24.04.5-desktop-amd64.iso
# does NOT ship filesystem.squashfs. It ships layered install sources
# (casper/minimal.squashfs + minimal.standard.squashfs + .live) selected by
# install-sources.yaml, and Calamares unpackfs cannot join layers. The build
# must either produce one merged casper/filesystem.squashfs (layer order in
# os-build/iso/BASE_FACTS.md) or the base must change. build_iso.sh refuses
# a layered base rather than patching the wrong file.
---
unpack:
    -   source: "/cdrom/casper/filesystem.squashfs"
        sourcefs: "squashfs"
        destination: ""
