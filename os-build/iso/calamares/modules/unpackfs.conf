# MetaOS 1.0 -- where the installed system comes from.
#
# Ubuntu live media mounts the ISO at /cdrom and ships the root filesystem
# as casper/filesystem.squashfs. The whole Meta provisioning (splash theme,
# Calamares config, release file) is already inside that squashfs, so this
# single unpack copies it to the target; there is no second payload.
---
unpack:
    -   source: "/cdrom/casper/filesystem.squashfs"
        sourcefs: "squashfs"
        destination: ""
