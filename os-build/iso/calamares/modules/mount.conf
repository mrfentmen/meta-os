# MetaOS 1.0 -- mount the target partitions before unpackfs.
#
# Present-but-default on purpose: the mount module runs on upstream
# defaults (mount every partition the partition module created under the
# rootMountPoint). Like hwclock.conf / localecfg.conf / summary.conf in
# this directory, the file exists so the choice of defaults is explicit
# and greppable, not so it can be misread as a forgotten module.
