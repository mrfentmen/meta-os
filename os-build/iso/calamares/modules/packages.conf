# MetaOS 1.0 -- package step.
#
# No network in the acceptance VM, so NOTHING is installed here: everything
# the installed system needs (plymouth, calamares, theme) is baked into the
# squashfs by provision.sh at build time. Only live-session packages that
# must not exist on the target are removed.
#
# ubiquity is in the list because a Xubuntu base may still carry it; on a
# base that does not, apt remove is a no-op.
---
backend: apt
update: false
upgrade: false
remove:
    - calamares
    - ubiquity
