# MetaOS 1.0 -- finished page.
#
# Reboot is pre-checked: the acceptance test is "install, reboot, land on
# the login screen", so the default button must do exactly that.
# The page offers reboot only: the checked box reboots straight into the
# installed system; unchecking it closes the installer and leaves the live
# session running (nothing else is offered — no "try again" maze).
---
restartNowEnabled: true
restartNowChecked: true
restartNowCommand: "systemctl -i reboot"
