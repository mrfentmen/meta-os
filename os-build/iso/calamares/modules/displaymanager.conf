# MetaOS 1.0 -- display manager selection.
#
# Xubuntu base uses LightDM. basicSetup is off because the Meta greeter
# config is owned by OC1's login lane; this module only points the installed
# system at the right DM. meta-branding.sh then enables lightdm.service.
---
displaymanagers:
    - lightdm
basicSetup: false
sysconfigSetup: false
