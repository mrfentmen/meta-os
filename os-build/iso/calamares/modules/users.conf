# MetaOS 1.0 -- user preseed.
#
# Full name and login are pre-filled; PASSWORD IS NOT PRESEEDABLE. Calamares
# 3.x has no unattended mode and no config key for a plaintext password, so
# the operator types it on the user page. That typed field is why the
# acceptance proof is a screendumped walkthrough, not a headless script.
#
# Checked against upstream src/modules/users/users.conf on 2026-11-02. Two
# corrections came out of that read:
#   * upstream ships `doAutologin: true` as the INITIAL checkbox state. That
#     would have preselected autologin on a product whose front door is the
#     login screen. Explicitly false here.
#   * upstream's sudoersGroup is `wheel` (its distro's choice) and its own
#     comment says to add that group to defaultGroups. Ubuntu's equivalent is
#     `sudo`, so `sudo` is in defaultGroups below.
---
defaultGroups:
    - users
    - lp
    - video
    - audio
    - network
    - sudo
autologinGroup: "autologin"
sudoersGroup: "sudo"
displayAutologin: false
doAutologin: false
setRootPassword: false
allowWeakPasswords: false
passwordRequirements:
    minLength: 8
    maxLength: 64
user:
    fullName: "Meta User"
    login: "meta"
