# MetaOS 1.0 -- user preseed.
#
# Full name and login are pre-filled; PASSWORD IS NOT PRESEEDABLE. Calamares
# 3.x has no unattended mode and no config key for a plaintext password, so
# the operator types it on the user page. That single typed field is why the
# acceptance proof is a screendumped walkthrough, not a headless script.
---
defaultGroups:
    - users
    - lp
    - video
    - audio
    - network
autologinGroup: "autologin"
sudoersGroup: "sudo"
setRootPassword: false
doReusePassword: false
allowWeakPasswords: false
passwordRequirements:
    minLength: 8
    maxLength: 64
user:
    fullName: "Meta User"
    login: "meta"
