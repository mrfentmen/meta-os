# MetaOS 1.0 -- locale / timezone preseed.
#
# Checked against upstream src/modules/locale/locale.conf on 2026-11-02.
# That file is explicit: *region* and *zone* pin the TIMEZONE map ("region:
# America", "zone: New_York" are its own defaults). They are NOT a language
# selector, and there is no `language:` key in this module. The first draft
# of this file had `language: en_US` and treated region as a language group
# -- two wrong keys that would have silently done nothing. Removed.
#
# Language for 1.0 comes from the live session / welcome page, which is the
# only place Calamares accepts it for this image.
---
region: "America"
zone: "New_York"
