# MetaOS 1.0 -- partitioning preseed.
#
# One-click path for the acceptance test: erase the target disk, GPT with an
# EFI system partition, ext4 root, no swap options offered (the proof VM has
# no hibernation need, and every offered choice is one more click).
#
# `efiSystemPartition` is a DEPRECATED alias upstream (src/modules/partition/
# partition.conf, checked 2026-11-02); the nested efi block below is the
# current form. A deprecated alias still works but warns in the install log,
# and warnings in the log are how real regressions hide.
---
efi:
    mountPoint: "/boot/efi"
    recommendedSize: "300MiB"
    minimumSize: "32MiB"
    label: "EFI"

userSwapChoices:
    - none
initialSwapChoice: "none"
initialPartitioningChoice: "erase"

drawNestedPartitions: false
alwaysShowPartitionLabels: true

# Harmless if a future Calamares renames them: ext4 is also its fallback.
defaultFileSystemType: "ext4"
availableFileSystemTypes:
    - "ext4"
