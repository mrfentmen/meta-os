# MetaOS 1.0 -- partitioning preseed.
#
# One-click path for the acceptance test: erase the target disk, GPT with
# an EFI system partition, ext4 root, no swap file (swap choices offered:
# none only -- a virtual disk in the proof VM has no hibernation need, and
# a swap prompt is one more click in the install path).
---
efiSystemPartition: "/boot/efi"
userSwapChoices:
    - none
drawNestedPartitions: false
alwaysShowPartitionLabels: true
defaultFileSystemType: "ext4"
availableFileSystemTypes:
    - "ext4"
initialPartitioningChoice: "erase"
initialSwapChoice: "none"
