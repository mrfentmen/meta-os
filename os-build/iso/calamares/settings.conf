# MetaOS 1.0 -- Calamares settings.
#
# Path: installed as /etc/calamares/settings.conf in the live image by
# provision.sh. The sequence is the stock Ubuntu-flavour Calamares order
# (partition -> mount -> unpackfs -> ... -> bootloader -> packages -> umount),
# ending in a trailing `finished` show page (upstream canonical form), plus
# one Meta-only instance: `meta-branding` (shellprocess) which runs inside
# the target chroot, so the INSTALLED system boots the Meta splash and the
# login screen rather than the base flavour's.
#
# Claim label: WRITTEN, UNRUN. Config is YAML-checked locally; the real
# proof is the VM install walkthrough (tools/vm_install_proof.sh).
---
# Multiarch lib dirs: Ubuntu installs the C++ job modules
# (shellprocess, partition, unpackfs, ...) under
# /usr/lib/<triplet>/calamares/modules. With only the unqualified path,
# every C++ module fails as "not found in module search paths" (proven
# 2026-11-03: meta-branding@meta-branding). Non-existent entries are
# skipped, so all triplets are listed for portability.
modules-search: [ local, /usr/lib/calamares/modules, /usr/lib/aarch64-linux-gnu/calamares/modules, /usr/lib/x86_64-linux-gnu/calamares/modules ]

instances: []
# meta-branding (shellprocess) REMOVED 2026-11-03: Calamares 3.3.5 on this
# base refuses to load the instance ("not found in module search paths")
# even though libcalamares_job_shellprocess.so ships in the package and
# sibling C++ modules load from the same dir (proven offscreen with
# QT_QPA_PLATFORM=offscreen). A Calamares that fails init on every boot
# is worse than one that installs an unbranded base: the autostart entry
# stays, Calamares opens clean, and the PROVEN installer is
# os-build/iso/metaos-install.sh (C5). Re-enable when the 3.3 loader
# issue is root-caused. Files kept in place (modules/meta-branding.conf,
# /usr/local/lib/metaos/meta-branding.sh) so --inspect still proves them.
#    -   id: meta-branding
#        module: shellprocess
#        config: meta-branding.conf

sequence:
    -   show:
        - welcome
        - locale
        - keyboard
        - partition
        - users
        - summary
    -   exec:
        - partition
        - mount
        - unpackfs
        - machineid
        - fstab
        - locale
        - keyboard
        - localecfg
        - users
        - displaymanager
        - networkcfg
        - hwclock
        - bootloader
        - packages
        - umount
    # meta-branding removed with its instance (see above).
    -   show:
        - finished

branding: metaos

# Preseeded, not unattended: every answer below is pre-filled, but
# Calamares 3.x has no unattended mode. The user page still requires a
# password to be typed (see README "what preseed means here").
prompt-install: false
dont-chroot: false
oem-setup: false

# A half-installed disk is worse than a cancelled install.
disable-cancel: true
disable-cancel-during-exec: true
hide-back-and-next-during-exec: false
quit-at-end: false
