<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- MetaOS R2-T1: generic aliases resolve to the vendored Meta families
       (payload-theme/fonts/MANIFEST.txt). Installed to
       /etc/fonts/conf.d/69-meta.conf by fonts/install.sh.
       No serif face is vendored on purpose (brief: neo-grotesque/geometric
       sans + mono, no serifs/scripts/decorative), so `serif' also resolves
       to Meta sans — nothing falls through to a non-Meta serif. -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Source Sans 3</family>
      <family>Archivo</family>
      <family>IBM Plex Sans</family>
      <family>Space Grotesk</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>Source Sans 3</family>
      <family>IBM Plex Sans</family>
      <family>Inter</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrains Mono</family>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>
  <!-- DejaVu Sans Mono is last-resort fallback only: it already ships in the
       base image via fonts-dejavu-core and carries no forbidden family name,
       so it keeps text readable if the vendored mono is ever absent.
       JetBrains Mono is always preferred first. -->
</fontconfig>
