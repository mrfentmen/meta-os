[Settings]
# System-wide GTK3 defaults for Meta OS.
#
# Why this file exists instead of only an xfconf key: GTK reads
# /etc/gtk-3.0/settings.ini itself, so a window shows the right titlebar buttons
# even when xfsettingsd has not exported Gtk/DecorationLayout yet — which is
# exactly what happened when the control gallery's window opened with a close
# button and nothing else.
#
# The layout string is the same one the token file carries (window_buttons.
# csd_layout): icon first, then minimise, maximise, close on the right. The
# three buttons are drawn black / white / blue by gtk.css.
gtk-theme-name=MetaOS
gtk-icon-theme-name=metaos
gtk-decoration-layout=icon:minimize,maximize,close
gtk-application-prefer-dark-theme=true
gtk-font-name=Inter 10
gtk-enable-animations=true
gtk-primary-button-warps-slider=true
