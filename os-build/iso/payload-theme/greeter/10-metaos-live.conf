# MetaOS live-session autologin (ISO only — installed by provision.sh).
# The live user is created at boot by casper-bottom/25adduser from the
# transplanted etc/casper.conf (USERNAME=ubuntu). No password, secret, or
# credential exists in this file: lightdm autologin needs none.
# Session is deliberately unset: lightdm falls back to the stock default
# (xubuntu), exactly as the base image behaves.
# The INSTALLED system is unaffected: Calamares meta-branding writes
# 90-metaos.conf blanking autologin, and 90 wins over 10 (lexical order).
[Seat:*]
autologin-user=ubuntu
autologin-user-timeout=0
