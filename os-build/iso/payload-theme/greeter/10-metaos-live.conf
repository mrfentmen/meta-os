# MetaOS live-session autologin (ISO only — installed by provision.sh).
# The live user is `meta`: os-build/identity/rename_user.sh renames the base
# image's `ubuntu` account and rewrites the casper USERNAME and this autologin
# line together. When this file said `ubuntu` and the account was already
# `meta`, a rebuild produced an image that sat at the greeter with no account
# to log into — so the two must be changed as one thing.
# No password, secret, or credential exists in this file: lightdm autologin
# needs none.
# Session is deliberately unset: lightdm falls back to the stock default
# session, exactly as the base image behaves.
# The INSTALLED system is unaffected: Calamares meta-branding writes
# 90-metaos.conf blanking autologin, and 90 wins over 10 (lexical order).
[Seat:*]
autologin-user=meta
autologin-user-timeout=0
