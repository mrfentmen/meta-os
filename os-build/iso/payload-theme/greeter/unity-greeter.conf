# MetaOS 1.0 login screen (unity-greeter — the greeter installed in the
# image). Install: /etc/lightdm/unity-greeter.conf
# The blue field is the theme's meta-rays wallpaper, the mark is the M avatar;
# the same Inter face the desktop uses. Autologin lives in
# lightdm.conf.d/{10-metaos-live,50-metaos}.conf and is NOT touched here.
[greeter]
background=/usr/share/backgrounds/meta-rays.png
logo=/usr/share/backgrounds/meta-m.png
draw-user-backgrounds=false
show-hostname=true
font-name=Inter 11
theme-name=MetaOS
icon-theme-name=metaos
