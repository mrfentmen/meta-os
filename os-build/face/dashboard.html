<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>Dashboard</title>
<style>body{font-family:system-ui;background:#0a0f1c;color:#eee;padding:24px}.cards{display:grid;grid-template-columns:repeat(2,minmax(160px,1fr));gap:12px}.card{background:#16213a;border-radius:10px;padding:14px}.card b{font-size:22px;display:block;overflow-wrap:anywhere}#stamp{min-height:1.4em}</style>
</head><body>
<h1>Dashboard <small>(live, this machine)</small></h1>
<div class="cards" id="cards"></div>
<p id="stamp" role="status">Loading live facts...</p>
<script>
// Every card below is built only from a successful fetch of
// http://127.0.0.1:18932/facts. Nothing is hardcoded: if the daemon is
// down, no card is rendered and the stamp says so.
async function tick(){
  var stamp = document.getElementById('stamp');
  var cards = document.getElementById('cards');
  try{
    const r = await fetch('http://127.0.0.1:18932/facts');
    if(!r.ok) throw new Error('http ' + r.status);
    const f = await r.json();
    cards.innerHTML = '';
    Object.keys(f).sort().forEach(function(k){
      var div = document.createElement('div');
      div.className = 'card';
      var label = document.createTextNode(k);
      div.appendChild(label);
      var b = document.createElement('b');
      b.textContent = String(f[k]);
      div.appendChild(b);
      cards.appendChild(div);
    });
    stamp.textContent = 'Updated ' + new Date().toLocaleTimeString() + ' from http://127.0.0.1:18932/facts';
  }catch(e){ stamp.textContent = 'backend unreachable on 18932 (is facts.py running?)'; }
}
setInterval(tick, 2000); tick();
</script>
<!-- Agent chat for the monitor. The cards and the stamp are the only facts the
     agent gets, so a stale or failed reading is visible to it instead of being
     smoothed over. -->
<script>
  window.metaAgentContext = function () {
    var c = document.getElementById("cards");
    var s = document.getElementById("stamp");
    return [c && c.textContent, s && s.textContent]
      .filter(Boolean)
      .join(" | ")
      .replace(/\s+/g, " ")
      .slice(0, 800);
  };
</script>
<script src="http://127.0.0.1:18934/js/agent-chat.js" data-app="monitor" data-label="Monitor" data-accent="#7fb8ff"
  data-context="Dashboard page: live machine facts read from http://127.0.0.1:18932/facts every two seconds. Nothing is hardcoded; when the facts service is down the page says unreachable and draws no cards."></script>
</body></html>
