<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendar</title>
<style>
:root{color-scheme:dark light}
html[data-theme="dark"]{--bg:#111;--fg:#eee;--mut:#999;--cell:#1c1c1c;--panel:#1c1c1c;--line:#333;--acc:#4f7ec2}
html[data-theme="light"]{--bg:#f4f4f4;--fg:#111;--mut:#666;--cell:#fff;--panel:#fff;--line:#ccc;--acc:#2456a6}
*{box-sizing:border-box}
body{font-family:system-ui;background:var(--bg);color:var(--fg);padding:24px;max-width:720px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h1{flex:1;font-size:22px;margin:0;min-width:170px}
button{font:inherit;font-size:14px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;transition:filter .15s}
button:hover{filter:brightness(1.15)}
html[data-motion="reduced"] button{transition:none}
#grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.dow{text-align:center;font-size:12px;color:var(--mut);padding:4px}
.day{background:var(--cell);color:var(--fg);border:1px solid transparent;border-radius:8px;min-height:52px;font-size:14px;position:relative;cursor:pointer;padding:4px}
.day:hover,.day:focus-visible{border-color:var(--acc)}
.day[aria-pressed="true"]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.day.dim{opacity:.35}.day.today{outline:1px dashed var(--acc)}
.dot{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:var(--acc)}
#day{margin-top:20px;border-top:1px solid var(--line);padding-top:12px}
#day-title{font-size:16px;margin:0 0 8px}
#events{list-style:none;margin:0;padding:0;font-size:14px}
#events li{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line)}
#events .empty{color:var(--mut)}
#add{display:flex;gap:6px;margin-top:10px}
#add input{flex:1;font:inherit;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
#status{color:var(--mut);font-size:13px;min-height:1.2em;margin:8px 0 0}
#paths{color:var(--mut);font-size:12px;margin:8px 0 0;overflow-wrap:anywhere}
#io{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
@media(max-width:520px){body{padding:16px}.day{min-height:44px}}
</style></head><body>
<header>
<button id="prev" aria-label="Previous month">&lt;</button>
<h1 id="title"></h1>
<button id="today">Today</button>
<button id="next" aria-label="Next month">&gt;</button>
</header>
<div id="grid" role="grid" aria-label="Month grid"></div>
<section id="day" aria-labelledby="day-title">
<h2 id="day-title">Select a day</h2>
<ul id="events"></ul>
<form id="add">
<label for="ev" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Event</label>
<input id="ev" placeholder="Add an event" autocomplete="off">
<button type="submit">Add</button>
</form>
<div id="io">
<button id="export" type="button">Export .ics</button>
<button id="importbtn" type="button">Import .ics</button>
<input id="importfile" type="file" accept=".ics,text/calendar" hidden>
</div>
<p id="status" role="status" aria-live="polite">Loading events from this machine...</p>
<p id="paths"></p>
</section>
<script>
(function(){
try{var t=localStorage.getItem('metaos-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}
try{if(localStorage.getItem('metaos-reduced-motion')==='1')document.documentElement.dataset.motion='reduced';}catch(e){}
var API='http://127.0.0.1:18937',CACHE_KEY='metaos-calendar-cache';
var cur=new Date(),sel=null,data={},online=false,icsFile='';
cur.setDate(1);
function key(y,m,dd){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(dd).padStart(2,'0');}
function keyOf(dt){return key(dt.getFullYear(),dt.getMonth(),dt.getDate());}
function human(k){var p=k.split('-');var d=new Date(Number(p[0]),Number(p[1])-1,Number(p[2]));return d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});}
function readCache(){try{var v=JSON.parse(localStorage.getItem(CACHE_KEY)||'{}');return v&&typeof v==='object'&&!Array.isArray(v)?v:{};}catch(e){return{};}}
function writeCache(){try{localStorage.setItem(CACHE_KEY,JSON.stringify(data));}catch(e){}}
function setStatus(m){document.getElementById('status').textContent=m;}
function api(method,route,body){
  var opts={method:method,headers:{'Content-Type':'application/json'}};
  if(body!==undefined)opts.body=JSON.stringify(body);
  return fetch(API+route,opts).then(function(r){return r.json().then(function(d){return{ok:r.ok,d:d};});});
}
function load(){
  setStatus('Loading events from this machine...');
  api('GET','/events').then(function(x){
    if(!x.ok||!x.d.ok)throw new Error(x.d.error||'load failed');
    online=true;data=x.d.events||{};icsFile=x.d.ics||'~/Notes/calendar.ics';writeCache();
    setStatus('Loaded events from this machine (notesd :18937).');
    document.getElementById('paths').textContent='Calendar file: '+icsFile+' (valid VCALENDAR, rewritten on every change).';
    renderGrid();renderDay();
  }).catch(function(){
    online=false;data=readCache();icsFile='~/Notes/calendar.ics';
    setStatus('Showing cached events (backend unreachable on 18937 — is notesd.py running?).');
    document.getElementById('paths').textContent='Offline cache only. The on-disk calendar.ics is untouched.';
    renderGrid();renderDay();
  });
}
function renderGrid(){
  var y=cur.getFullYear(),m=cur.getMonth();
  document.getElementById('title').textContent=cur.toLocaleString(undefined,{month:'long',year:'numeric'});
  var g=document.getElementById('grid');g.innerHTML='';
  ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(function(d){var s=document.createElement('div');s.className='dow';s.textContent=d;s.setAttribute('role','columnheader');g.appendChild(s);});
  var first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate();
  var now=new Date(),cells=[];
  for(var i=first-1;i>=0;i--)cells.push({d:prev-i,dim:1,mo:m-1});
  for(var d=1;d<=days;d++)cells.push({d:d,dim:0,mo:m});
  var tail=(7-(cells.length%7))%7;for(var t=1;t<=tail;t++)cells.push({d:t,dim:1,mo:m+1});
  cells.forEach(function(c){
    var dt=new Date(y,c.mo,c.d),k=keyOf(dt);
    var n=(data[k]||[]).length;
    var b=document.createElement('button');b.type='button';b.className='day'+(c.dim?' dim':'')+(k===keyOf(now)?' today':'');
    b.textContent=c.d;
    b.setAttribute('aria-pressed',k===sel?'true':'false');
    b.setAttribute('aria-label',human(k)+(n?', '+n+(n===1?' event':' events'):', no events'));
    if(n){var s=document.createElement('span');s.className='dot';s.setAttribute('aria-hidden','true');b.appendChild(s);}
    b.onclick=function(){sel=k;renderGrid();renderDay();};
    g.appendChild(b);
  });
}
function renderDay(){
  var title=document.getElementById('day-title'),ul=document.getElementById('events');
  ul.innerHTML='';
  if(!sel){title.textContent='Select a day';return;}
  title.textContent=human(sel);
  var items=data[sel]||[];
  if(!items.length){var li=document.createElement('li');li.className='empty';li.textContent='No events on this day.';ul.appendChild(li);return;}
  items.forEach(function(text,i){
    var li=document.createElement('li');
    var span=document.createElement('span');span.textContent=text;
    var del=document.createElement('button');del.type='button';del.textContent='Delete';
    del.setAttribute('aria-label','Delete '+text+' on '+human(sel));
    del.onclick=function(){
      if(!online){setStatus('Showing cached events — cannot delete while offline.');return;}
      api('POST','/events/delete',{date:sel,index:i}).then(function(x){
        if(!x.ok||!x.d.ok)throw new Error(x.d.error||'delete failed');
        var arr=data[sel]||[];arr.splice(i,1);
        if(arr.length)data[sel]=arr;else delete data[sel];
        writeCache();renderGrid();renderDay();
        setStatus('Event deleted from this machine.');
      }).catch(function(){setStatus('Showing cached events — delete failed (backend unreachable on 18937).');});
    };
    li.appendChild(span);li.appendChild(del);ul.appendChild(li);
  });
}
function moveMonth(n){cur.setMonth(cur.getMonth()+n);renderGrid();}
document.getElementById('prev').onclick=function(){moveMonth(-1);};
document.getElementById('next').onclick=function(){moveMonth(1);};
document.getElementById('today').onclick=function(){cur=new Date();cur.setDate(1);sel=keyOf(new Date());renderGrid();renderDay();};
document.getElementById('add').onsubmit=function(e){
  e.preventDefault();
  var input=document.getElementById('ev'),v=input.value.trim();
  if(!sel){setStatus('Select a day first.');return;}
  if(!v)return;
  if(!online){setStatus('Showing cached events — cannot add while offline.');return;}
  api('POST','/events',{date:sel,text:v}).then(function(x){
    if(!x.ok||!x.d.ok)throw new Error(x.d.error||'add failed');
    data[sel]=data[sel]||[];data[sel].push(v);writeCache();
    input.value='';renderGrid();renderDay();
    setStatus('Event saved to this machine.');
  }).catch(function(){setStatus('Showing cached events — add failed (backend unreachable on 18937).');});
};
document.getElementById('export').onclick=function(){
  api('GET','/export').then(function(x){
    if(!x.ok||!x.d.ok)throw new Error(x.d.error||'export failed');
    var blob=new Blob([x.d.ics],{type:'text/calendar'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='calendar.ics';
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);
    setStatus('Exported '+(x.d.ics.split('BEGIN:VEVENT').length-1)+' event(s) from '+(x.d.path||icsFile)+'.');
  }).catch(function(){setStatus('Showing cached events — export failed (backend unreachable on 18937).');});
};
document.getElementById('importbtn').onclick=function(){document.getElementById('importfile').click();};
document.getElementById('importfile').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    api('POST','/import',{ics:String(rd.result||'')}).then(function(x){
      if(!x.ok||!x.d.ok)throw new Error(x.d.error||'import failed');
      setStatus('Imported '+x.d.added+' event(s) into this machine.');
      e.target.value='';load();
    }).catch(function(){setStatus('Import failed: '+(online?'bad .ics file':'backend unreachable on 18937')+'.');e.target.value='';});
  };
  rd.readAsText(f);
});
sel=keyOf(new Date());
load();
})();
</script></body></html>
