<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meta OS — Log in</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font: 14px/1.4 system-ui, -apple-system, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; overflow: hidden;
    background: #020814; color: #fff;
  }
  html[data-theme="light"] body { background: #eaf2ff; color: #111; }
  #logo-background {
    position: fixed; inset: 0; width: 100%; height: 100%;
    background: #020814;
  }
  html[data-theme="light"] #logo-background { background: #eaf2ff; }
  .card {
    position: relative; z-index: 10;
    width: min(340px, 90vw);
    padding: 32px 28px;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    border-radius: 18px;
    background: rgba(20, 28, 44, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.18);
    box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(18px) saturate(1.3);
    -webkit-backdrop-filter: blur(18px) saturate(1.3);
  }
  html[data-theme="light"] .card {
    background: rgba(255, 255, 255, 0.55);
    border-color: rgba(0, 0, 0, 0.12);
    box-shadow: 0 12px 48px rgba(30, 60, 120, 0.18);
  }
  .avatar {
    width: 84px; height: 84px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 38px; font-weight: 600;
    color: #fff; background: linear-gradient(135deg, #2b5aa0, #4f7ec2);
    border: 2px solid rgba(255, 255, 255, 0.35);
    user-select: none;
  }
  .name { font-size: 20px; font-weight: 600; }
  .hint { font-size: 12px; opacity: 0.65; }
  form { width: 100%; display: flex; flex-direction: column; gap: 10px; }
  input[type="password"] {
    width: 100%; padding: 10px 12px;
    font: inherit; color: inherit;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    background: rgba(0, 0, 0, 0.35);
    outline: none;
  }
  html[data-theme="light"] input[type="password"] {
    border-color: rgba(0, 0, 0, 0.2);
    background: rgba(255, 255, 255, 0.8);
  }
  input[type="password"]:focus { border-color: #4f7ec2; }
  button {
    width: 100%; padding: 10px 12px;
    font: inherit; font-weight: 600; cursor: pointer;
    border: none; border-radius: 10px;
    color: #fff; background: #2f6fd0;
  }
  button:hover, button:focus-visible { background: #3d80e0; }
  .card.shake { animation: shake 0.4s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-10px); }
    40% { transform: translateX(9px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(4px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .card.shake { animation: none; }
  }
</style>
</head>
<body data-product="vigiles">
<canvas id="logo-background" aria-hidden="true"></canvas>
<div class="card" id="card">
  <div class="avatar" aria-hidden="true">M</div>
  <div class="name">Mrfentmen</div>
  <div class="hint">Enter any password to sign in (demo)</div>
  <form id="login-form" action="shell.html" method="get">
    <input type="password" id="password" name="password"
      placeholder="Password" autocomplete="current-password" autofocus>
    <button type="submit">Sign in</button>
  </form>
</div>
<script src="vendor-logo-background.js"></script>
<script>
"use strict";
/* Theme: dark default, light only when explicitly stored. */
try {
  var t = window.localStorage && window.localStorage.getItem("metaos-theme");
  document.documentElement.setAttribute(
    "data-theme", t === "light" ? "light" : "dark");
} catch (e) {
  document.documentElement.setAttribute("data-theme", "dark");
}
/* Login: any non-empty password enters the desktop; empty shakes. */
var card = document.getElementById("card");
var form = document.getElementById("login-form");
var pw = document.getElementById("password");
form.addEventListener("submit", function (ev) {
  if (!pw.value) {
    ev.preventDefault();
    card.classList.remove("shake");
    void card.offsetWidth; /* restart the keyframe animation */
    card.classList.add("shake");
    pw.focus();
    return;
  }
  ev.preventDefault();
  window.location.href = "shell.html";
});
card.addEventListener("animationend", function () {
  card.classList.remove("shake");
});
</script>
</body>
</html>
