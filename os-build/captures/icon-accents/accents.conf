# wallpaper basename -> icon set. Read by meta-icon-accent.
# Order: first match wins. Unlisted wallpapers fall back to default.
default=blue-B

meta-ascii.png=blue-B
meta-wallpaper.png=blue-B
meta-rays.png=ice-B
meta-dawn.png=amber-B
meta-dusk.png=violet-B

# every set, so the Settings picker can list them
set=blue-B|Meta Blue — solid
set=blue-A|Meta Blue — monoline
set=blue-C|Meta Blue — dot matrix
set=ice-B|Ice — cyan
set=amber-B|Amber — dawn
set=violet-B|Violet — dusk
set=teal-B|Teal — pine
set=mono-B|Mono — no hue
