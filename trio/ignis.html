<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Ignis: Fire watch</title>
<style>
  /* Ignis is the wall-first division. Large frames own the screen, the map is
     a small inset that starts closed, and the session reads as a timeline down
     the left rather than as a table.

     Its voice is warm and editorial: serif body text, ember accent, 2 px
     edges, letterspaced mono only for machine facts. It shares behaviour with
     the other two pages and no stylesheet with them. */

  /* ---- base, owned here ---- */
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #120b08;
    color: #f3e9e2;
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-size: 13.5px;
    line-height: 1.5;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, h4, p, ul, ol { margin: 0; }
  ul, ol { padding: 0; list-style: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input, select { font: inherit; }
  :focus-visible { outline: 1px solid #d9602b; outline-offset: 2px; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: rgba(214, 160, 120, 0.22); border-radius: 2px; }
  .mono { font-family: ui-monospace, "SF Mono", "DejaVu Sans Mono", monospace; }
  .dim { color: #b39c8d; }
  .dimmer { color: #7d6a5e; }
  .fail { color: #f0645a; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 11px; border: 1px solid rgba(214, 160, 120, 0.32);
    border-radius: 2px; background: #241711; color: #f3e9e2;
    font-family: ui-monospace, monospace; font-size: 10.5px;
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  .btn:hover { border-color: #d9602b; }
  .btn:disabled { opacity: 0.45; }
  .btn.primary { background: #d9602b; border-color: #d9602b; color: #1a0d06; }
  .btn.ghost { background: none; }
  :root {
    --ink: #120b08;
    --panel: #1a110c;
    --raised: #241711;
    --line: rgba(214, 160, 120, 0.16);
    --line-strong: rgba(214, 160, 120, 0.32);
    --text: #f3e9e2;
    --dim: #b39c8d;
    --dimmer: #7d6a5e;
    --accent: #d9602b;
    --radius: 0;
  }
  body { display: grid; grid-template-rows: 40px 1fr; height: 100vh; background: var(--ink); }

  /* The ASCII loop behind the wall, tinted by the renderer's ignis palette.
     Warm scrim keeps the ember ribbon from competing with live footage. */
  /* Shifted left so the loop's edge passes behind the session column instead
     of hiding under the opaque wall frames. */
  #logo-background { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; opacity: 0.5; pointer-events: none; transform: translateX(-13%) scale(1.06); transform-origin: 50% 50%; }
  #spin-shade { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(ellipse at 30% 50%, rgba(18, 11, 8, 0.08) 0%, rgba(18, 11, 8, 0.46) 72%, rgba(18, 11, 8, 0.8) 100%); }
  .top, main { position: relative; z-index: 1; }

  .top {
    display: flex; align-items: baseline; gap: 14px; padding: 0 16px;
    border-bottom: 1px solid var(--line); background: rgba(23, 15, 10, 0.8);
  }
  .mark { display: flex; align-items: center; gap: 8px; font-family: Georgia, "Times New Roman", serif; font-size: 17px; letter-spacing: 0.02em; }
  .mark svg { color: var(--accent); margin-top: -1px; }
  .ops-trigger {
    margin-left: 2px; padding: 3px 10px; border: 1px solid var(--line-strong);
    border-radius: 2px; font-family: ui-monospace, monospace; font-size: 9.5px;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim);
  }
  .ops-trigger:hover { color: var(--text); border-color: var(--accent); }
  .ops-trigger:disabled { opacity: 0.45; cursor: default; }
  .sub { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dimmer); }
  .top .right { margin-left: auto; display: flex; gap: 16px; align-items: baseline; }
  .src { font-family: var(--mono); font-size: 11px; color: var(--dim); }
  .src.warn { color: #d8a23a; }
  .src.bad { color: var(--flag); }
  #clock { font-family: Georgia, serif; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }

  main { display: grid; grid-template-columns: 244px 1fr; min-height: 0; }

  /* session timeline, elapsed time in the gutter, duty agent pinned below it */
  .timeline {
    display: grid; grid-template-rows: auto minmax(0, 1fr) 238px auto;
    border-right: 1px solid var(--line); background: rgba(22, 14, 9, 0.7); min-height: 0;
  }
  .timeline h2 {
    font-family: var(--mono); font-size: 10px; line-height: 1.4; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--dimmer); font-weight: 500;
    padding: 14px 14px 8px; border-bottom: 1px solid var(--line);
  }
  .feed { overflow-y: auto; min-height: 0; }
  .entry { display: grid; grid-template-columns: 46px 1fr; gap: 8px; padding: 7px 12px; }
  .entry + .entry { border-top: 1px solid rgba(214, 160, 120, 0.08); }
  .entry .when { font-family: Georgia, serif; font-size: 11px; color: var(--dimmer); font-variant-numeric: tabular-nums; }
  .entry .what { font-size: 11.5px; color: var(--dim); line-height: 1.4; }
  .entry.bad .what { color: var(--flag); }
  .entry b { color: var(--text); font-weight: 600; }
  .timeline-foot {
    padding: 10px 12px; border-top: 1px solid var(--line);
    font-family: var(--mono); font-size: 9.5px; color: var(--dimmer); line-height: 1.45;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
  }

  /* duty agent: the same console every division carries, in the timeline's
     warm editorial voice rather than a terminal or a paper card. */
  .timeline-agent { min-height: 0; display: grid; border-top: 1px solid var(--line-strong); background: #140d09; }
  .agent { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; }
  .agent-head { display: flex; align-items: baseline; gap: 8px; padding: 9px 12px 6px; }
  .agent-head h2 { font-family: Georgia, "Times New Roman", serif; font-size: 14px; font-weight: 400; }
  .agent-head .state { margin-left: auto; font-family: var(--mono); font-size: 8.5px; color: var(--dimmer); }
  .agent-head .state.bad { color: var(--flag); }
  .agent-log { overflow-y: auto; padding: 0 12px 10px; display: flex; flex-direction: column; gap: 7px; }
  .agent-log .turn { font-size: 11px; line-height: 1.5; }
  .agent-log .turn.user { align-self: flex-end; max-width: 92%; background: #241711; border: 1px solid var(--line); border-radius: 2px; padding: 4px 8px; font-family: var(--mono); font-size: 9.5px; }
  .agent-log .turn.agent { color: var(--text); border-left: 2px solid var(--accent); padding-left: 8px; }
  .agent-log .turn.note { font-family: var(--mono); font-size: 9px; color: var(--dimmer); }
  .agent-log .turn.bad { color: var(--flag); border-left: 2px solid var(--flag); padding-left: 8px; }
  .agent form { display: flex; gap: 5px; padding: 7px 10px; border-top: 1px solid var(--line); }
  .agent input { flex: 1; min-width: 0; background: #120b08; border: 1px solid var(--line-strong); border-radius: 2px; color: var(--text); padding: 4px 6px; font-family: var(--mono); font-size: 9.5px; }
  .agent input:focus { outline: 1px solid var(--accent); }
  .agent button { border: 1px solid var(--line-strong); border-radius: 2px; background: #241711; color: var(--text); padding: 4px 8px; font-family: var(--mono); font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; }
  .agent button:hover { border-color: var(--accent); }

  /* The stage is the wall plus a fixed strip. min-height:0 on every grid child
     is what stops a 16:9 snapshot from forcing its row taller than the window
     and pushing the strip off screen. */
  .stage { position: relative; min-width: 0; min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) 84px; }
  .wall {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
    gap: 1px; background: var(--line); min-height: 0;
  }
  .slot {
    position: relative; background: #0d0806; overflow: hidden;
    display: grid; grid-template-rows: minmax(0, 1fr) auto; min-width: 0; min-height: 0;
  }
  .slot img { width: 100%; height: 100%; min-height: 0; object-fit: cover; display: block; opacity: 0.92; }
  .slot .slot-empty {
    display: grid; place-items: center; height: 100%;
    font-family: var(--mono); font-size: 10px; color: var(--dimmer); text-align: center; padding: 12px;
  }
  .slot .slot-bar {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 10px; background: rgba(12, 8, 6, 0.9);
    border-top: 1px solid var(--line);
  }
  .slot .slot-name { font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slot .slot-state { font-family: var(--mono); font-size: 10px; color: var(--dimmer); margin-left: auto; white-space: nowrap; }
  .slot .slot-state.flag { color: var(--flag); }
  .slot .slot-actions { display: flex; gap: 6px; }
  .slot .mini {
    padding: 2px 8px; border: 1px solid var(--line-strong); font-family: var(--mono);
    font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim);
  }
  .slot .mini:hover { border-color: var(--accent); color: var(--text); }
  .slot .mini[disabled] { opacity: 0.45; }
  .slot .src-tag {
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--dim); border: 1px solid var(--line-strong);
    border-radius: 3px; padding: 0 4px;
  }
  /* a 2 px left edge carries the division state, no rounded corners anywhere */
  .slot.flagged { box-shadow: inset 3px 0 0 var(--flag); }
  .slot.watched { box-shadow: inset 3px 0 0 var(--accent); }

  /* hot frames: one strip, newest on the right */
  .strip {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    border-top: 1px solid var(--line); background: rgba(23, 15, 10, 0.78); overflow-x: auto;
    min-width: 0; height: 84px;
  }
  .strip .label {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--dimmer); white-space: nowrap;
  }
  .hot { display: flex; gap: 8px; }
  .hot button {
    position: relative; width: 104px; height: 60px; flex: none;
    border: 1px solid var(--line-strong); background: #0d0806; padding: 0; overflow: hidden;
  }
  .hot button img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hot button .tag {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 2px 4px;
    background: rgba(10, 6, 4, 0.86); font-family: var(--mono); font-size: 9px;
    color: var(--dim); text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .hot button.flag { border-color: var(--flag); }
  .hot .empty { font-size: 11px; color: var(--dimmer); }

  /* map inset: closed by default, opens on demand */
  .inset {
    position: absolute; right: 14px; bottom: 92px; width: 268px; height: 196px;
    border: 1px solid var(--line-strong); background: #0b0705; display: none;
  }
  .inset.open { display: block; }
  .inset canvas { width: 100%; height: 100%; display: block; }
  .inset .close {
    position: absolute; top: 2px; right: 4px; color: var(--dim); font-size: 13px;
    line-height: 1; padding: 2px 4px;
  }
  /* The map toggle lives in the strip, not over a frame: a control floating on
     top of a snapshot hides the one line that says what the snapshot is. */
  .map-toggle {
    margin-left: auto; flex: none;
    padding: 4px 10px; border: 1px solid var(--line-strong);
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--dim); background: rgba(18, 11, 8, 0.9);
  }
  .map-toggle:hover { border-color: var(--accent); color: var(--text); }

  /* map modes ride inside the inset so no control floats over a frame */
  .inset-modes {
    position: absolute; left: 4px; top: 4px; display: flex; gap: 0;
    background: rgba(18, 11, 8, 0.88); border: 1px solid var(--line-strong);
    border-radius: 2px; overflow: hidden;
  }
  .inset-modes button {
    padding: 2px 6px; font-family: ui-monospace, monospace; font-size: 8.5px;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim);
    border-left: 1px solid var(--line);
  }
  .inset-modes button:first-child { border-left: 0; }
  .inset-modes button[aria-pressed="true"] { background: rgba(217, 96, 43, 0.3); color: #fff; }

  /* ---- operations drawer: a right-hand gallery plate ---- */
  .ops {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 95vw); z-index: 50;
    display: grid; grid-template-columns: 126px 1fr; grid-template-rows: auto auto 1fr;
    background: #1a110c; border-left: 1px solid rgba(214, 160, 120, 0.4);
    box-shadow: -24px 0 60px rgba(0, 0, 0, 0.5);
    transform: translateX(100%); transition: transform 170ms ease;
  }
  .ops.open { transform: translateX(0); }
  .ops[hidden] { display: none; }
  .ops-head { grid-column: 1 / -1; grid-row: 1; padding: 14px 16px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; gap: 12px; }
  .ops-title h2 { font-family: Georgia, serif; font-size: 22px; font-weight: 400; letter-spacing: 0.01em; }
  .ops-badge { display: block; margin-top: 3px; font-family: ui-monospace, monospace; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dimmer); }
  .ops-head-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .ops-source { max-width: 220px; font-family: ui-monospace, monospace; font-size: 9.5px; color: var(--dim); text-align: right; }
  .ops-source.warn { color: #d8a23a; }
  .ops-source.bad { color: var(--flag); }
  .ops-close { display: grid; place-items: center; width: 26px; height: 26px; border: 1px solid var(--line-strong); border-radius: 2px; color: var(--dim); }
  .ops-close:hover { color: var(--text); border-color: var(--accent); }
  .ops-tabs { grid-column: 1; grid-row: 2 / 4; display: flex; flex-direction: column; gap: 0; border-right: 1px solid var(--line); padding-top: 8px; }
  .ops-tab {
    padding: 9px 14px; text-align: left; font-family: ui-monospace, monospace;
    font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--dimmer); border-left: 2px solid transparent;
  }
  .ops-tab:hover { color: var(--text); }
  .ops-tab[aria-pressed="true"] { color: var(--text); border-left-color: var(--accent); background: rgba(217, 96, 43, 0.09); }
  .ops-status { grid-column: 2; grid-row: 2; padding: 7px 16px; font-family: ui-monospace, monospace; font-size: 10px; color: var(--dim); border-bottom: 1px solid var(--line); }
  .ops-status:empty { display: none; }
  .ops-body { grid-column: 2; grid-row: 3; overflow-y: auto; padding: 14px 16px 22px; display: grid; gap: 16px; align-content: start; }
  .ops-note { font-size: 12px; color: var(--dim); line-height: 1.55; }
  .ops-note.muted { color: var(--dimmer); }
  .ops-note.bad { color: var(--flag); }
  .ops-note.ok { color: #a8c79b; }
  .ops-block { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 9px; }
  .ops-block-head h3 { font-family: Georgia, serif; font-size: 15px; font-weight: 400; }
  .ops-hint { font-size: 11.5px; color: var(--dimmer); margin-top: 1px; }
  .ops-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .ops-row-between { justify-content: space-between; }
  .ops-btn { padding: 5px 11px; border: 1px solid var(--line-strong); border-radius: 2px; background: #241711; color: var(--text); font-family: ui-monospace, monospace; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; }
  .ops-btn:hover { border-color: var(--accent); }
  .ops-btn.primary { background: var(--accent); border-color: var(--accent); color: #1a0d06; }
  .ops-btn.ghost { background: none; }
  .ops-btn:disabled { opacity: 0.45; }
  .ops-input { width: 100%; padding: 6px 8px; background: #120b08; border: 1px solid var(--line-strong); border-radius: 2px; color: var(--text); font-family: ui-monospace, monospace; font-size: 10.5px; }
  .ops-field { display: grid; gap: 3px; flex: 1 1 240px; font-family: ui-monospace, monospace; font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
  .ops-file { font-family: ui-monospace, monospace; font-size: 10px; color: var(--dim); }
  .ops-video { width: 100%; max-height: 240px; background: #0d0806; border: 1px solid var(--line); border-radius: 2px; object-fit: contain; }
  .ops-wall { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); }
  .ops-wall-card { background: #170f0a; display: grid; }
  .ops-wall-img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #0d0806; filter: sepia(0.12); }
  .ops-wall-missing { aspect-ratio: 16 / 9; display: grid; place-items: center; padding: 10px; font-size: 11px; color: var(--dimmer); }
  .ops-wall-body { padding: 8px 10px 10px; display: grid; gap: 3px; }
  .ops-wall-body h4 { font-family: Georgia, serif; font-size: 13px; font-weight: 400; }
  .ops-wall-area { font-family: ui-monospace, monospace; font-size: 9px; letter-spacing: 0.06em; color: var(--dimmer); }
  .ops-wall-last { font-size: 11px; color: var(--dim); }
  .ops-wall-last.flag, .ops-wall-last.bad { color: var(--flag); }
  .ops-list { display: grid; border-top: 1px solid var(--line); }
  .ops-hist-row { display: grid; grid-template-columns: 84px 1fr 118px; gap: 8px; padding: 6px 2px; text-align: left; border-top: 1px solid rgba(214, 160, 120, 0.1); font-size: 12px; }
  .ops-hist-row:first-child { border-top: 0; }
  .ops-hist-row:hover, .ops-hist-row.on { background: rgba(217, 96, 43, 0.1); }
  .ops-hist-time, .ops-hist-src { font-family: ui-monospace, monospace; font-size: 9.5px; color: var(--dimmer); }
  .ops-hist-cat { color: var(--dim); }
  .ops-hist-cat.flag, .ops-hist-cat.bad { color: var(--flag); }
  .ops-detail { border: 1px solid var(--line-strong); border-radius: 2px; padding: 12px; display: grid; gap: 6px; background: #170f0a; }
  .ops-detail:empty { display: none; }
  .ops-cat { font-family: Georgia, serif; font-size: 17px; }
  .ops-cat.flag, .ops-cat.bad { color: var(--flag); }
  .ops-sum { font-size: 12px; color: var(--dim); }
  .ops-meta { font-family: ui-monospace, monospace; font-size: 9.5px; color: var(--dimmer); }
  .ops-steps { display: grid; gap: 2px; font-family: ui-monospace, monospace; font-size: 9.5px; }
  .ops-steps .done { color: #a8c79b; }
  .ops-steps .miss { color: var(--dimmer); }
  .ops-metrics { display: flex; flex-wrap: wrap; gap: 26px; }
  .ops-metric { display: grid; }
  .ops-metric-v { font-family: Georgia, serif; font-size: 26px; font-variant-numeric: tabular-nums; }
  .ops-metric-k { font-family: ui-monospace, monospace; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
  .ops-metric-h { font-size: 10px; color: var(--dimmer); }
  .ops-table { display: grid; font-size: 12px; }
  .ops-tr { display: grid; grid-template-columns: 1fr 70px 100px; gap: 8px; padding: 4px 0; border-top: 1px solid rgba(214, 160, 120, 0.12); }
  .ops-tr span:not(:first-child) { text-align: right; font-variant-numeric: tabular-nums; }
  .ops-thead { color: var(--dimmer); font-family: ui-monospace, monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; border-top: 0; }
  .ops-kvlist { display: grid; gap: 3px; }
  .ops-kv { display: grid; grid-template-columns: 130px 1fr; gap: 10px; font-size: 12px; padding: 3px 0; border-top: 1px solid rgba(214, 160, 120, 0.1); }
  .ops-k { font-family: ui-monospace, monospace; font-size: 9.5px; letter-spacing: 0.06em; color: var(--dim); }
  .ops-kv.bad .ops-v { color: var(--flag); }
  .ops-search { position: fixed; inset: 0; z-index: 70; background: rgba(10, 6, 4, 0.76); display: grid; place-items: start center; padding-top: 12vh; }
  .ops-search[hidden] { display: none; }
  .ops-search-box { width: min(600px, 92vw); background: #1a110c; border: 1px solid var(--line-strong); border-radius: 2px; padding: 16px; display: grid; gap: 10px; }
  .ops-search-label { font-family: ui-monospace, monospace; font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
  .ops-search-input { width: 100%; padding: 8px 10px; background: #120b08; border: 1px solid var(--line-strong); border-radius: 2px; color: var(--text); font-family: ui-monospace, monospace; }
  .ops-search-results { display: grid; max-height: 46vh; overflow-y: auto; }
  .ops-search-row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 4px; border-top: 1px solid rgba(214, 160, 120, 0.12); text-align: left; font-size: 13px; }
  .ops-search-row:hover { background: rgba(217, 96, 43, 0.12); }
  .ops-search-meta { font-family: ui-monospace, monospace; font-size: 9.5px; color: var(--dimmer); }
  .ops-help { display: grid; gap: 5px; font-size: 13px; }

  @media (max-width: 1040px) {
    main { grid-template-columns: 210px 1fr; }
    .inset { width: 220px; height: 160px; }
    .ops { grid-template-columns: 100px 1fr; }
  }
</style>
</head>
<body data-product="ignis">
<canvas id="logo-background" aria-hidden="true"></canvas>
<div id="spin-shade" aria-hidden="true"></div>
<header class="top">
  <p class="mark">
    <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M8 1.8c2.6 2.7 1.4 4.2.6 5.2-.6.7-1 1.4-.4 2.3.5-.9 1.2-1.2 1.7-1.2 1.4 0 2.3 1.2 2.3 2.7 0 2-1.8 3.4-4.2 3.4S4 12.8 4 10.8c0-2.6 1.9-3.7 2.8-5.2C7.8 3.9 7.9 2.8 8 1.8Z" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
    Ignis
  </p>
  <p class="sub">Meta OS / Fire</p>
  <div class="right">
    <button id="assess-watched" class="ops-trigger" type="button">Assess watched</button>
    <button id="ops-open" class="ops-trigger" type="button" aria-haspopup="dialog">Operations</button>
    <p id="source" class="src">Loading the camera list.</p>
    <p id="clock">--:--:--</p>
  </div>
</header>

<main>
  <aside class="timeline">
    <h2>Session</h2>
    <div id="feed" class="feed"></div>
    <section class="timeline-agent"><aside id="agent" class="agent"></aside></section>
    <p id="crew" class="timeline-foot">Crew: reading…</p>
  </aside>

  <section class="stage">
    <div id="wall" class="wall"></div>
    <div class="strip">
      <span class="label">Hot frames</span>
      <div id="hot" class="hot"><span class="empty">Nothing assessed yet.</span></div>
      <button id="map-toggle" class="map-toggle" type="button">Map</button>
    </div>
    <div id="inset" class="inset">
      <canvas id="map" aria-label="Camera map"></canvas>
      <div class="inset-modes" role="group" aria-label="Map mode and layers">
        <button type="button" data-mode="city" aria-pressed="true">City</button>
        <button type="button" data-mode="tactical" aria-pressed="false">Tactical</button>
        <button type="button" data-mode="incident" aria-pressed="false">Incident</button>
        <button type="button" data-mode="focus" aria-pressed="false">Focus</button>
        <button type="button" id="fires-toggle" aria-pressed="false">Fires</button>
      </div>
      <button id="map-close" class="close" type="button" aria-label="Close map">
        <svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>
      </button>
    </div>
  </section>
</main>

<div id="ops-mount"></div>

<script src="../js/logo-background.js"></script>
<script type="module">
import { createStore, LocalMap, clock, ago, el, sourceTag, DIVISIONS } from "./core.js";
import { createOps } from "./ops.js";
import { createAgent } from "./agent.js";

const division = DIVISIONS.fire;
const store = createStore("fire");
const $ = (id) => document.getElementById(id);

const map = LocalMap($("map"), {
  accent: division.accent,
  center: { lat: 40.73, lon: -73.95 },
  zoom: 10.6,
  onSelect: (id) => {
    store.setSelected(id);
    const target = slots().find((c) => c.id === id);
    if (target) store.assess(id);
  },
});

const SLOTS = 4;

function slots() {
  const out = [];
  for (const id of store.watch) {
    const cam = store.byId.get(id);
    if (cam) out.push(cam);
    if (out.length === SLOTS) return out;
  }
  for (const cam of store.recent(6)) {
    if (out.includes(cam)) continue;
    out.push(cam);
    if (out.length === SLOTS) return out;
  }
  for (const cam of store.cameras) {
    if (out.includes(cam)) continue;
    out.push(cam);
    if (out.length === SLOTS) return out;
  }
  return out;
}

function stamp(at) {
  return at ? clock(at) : "--:--";
}

function renderWall() {
  const host = $("wall");
  const cams = slots();
  host.replaceChildren(
    ...Array.from({ length: SLOTS }, (_, i) => {
      const cam = cams[i];
      const node = el("div", { class: "slot" });
      if (!cam) {
        node.append(
          el("div", { class: "slot-empty", text: "No camera in this slot. Watch one from the timeline or open the map." })
        );
        return node;
      }
      const r = store.results.get(cam.id);
      const busy = store.busy.has(cam.id);
      if (r && r.flagged) node.classList.add("flagged");
      else if (store.watch.has(cam.id)) node.classList.add("watched");

      const img = el("img", { alt: "Snapshot of " + cam.name, loading: "lazy" });
      img.src = cam.imageUrl + (cam.imageUrl.includes("?") ? "&" : "?") + "t=" + Date.now();
      img.addEventListener("error", () => {
        img.replaceWith(
          el("div", { class: "slot-empty", text: "Snapshot did not load from the camera host." })
        );
      });
      node.append(img);

      const state = busy
        ? "assessing…"
        : r
          ? r.status === "failed"
            ? "failed: " + r.reason
            : r.category + " · " + ago(r.at)
          : "not assessed";
      const stateNode = el("span", { class: "slot-state" + (r && r.flagged ? " flag" : ""), text: state });
      stateNode.title = state;

      const watchBtn = el("button", {
        class: "mini",
        type: "button",
        text: store.watch.has(cam.id) ? "Unwatch" : "Watch",
      });
      watchBtn.addEventListener("click", () => store.toggleWatch(cam.id));

      const assessBtn = el("button", {
        class: "mini",
        type: "button",
        text: busy ? "…" : "Assess",
      });
      assessBtn.disabled = busy;
      assessBtn.addEventListener("click", () => store.assess(cam.id));

      node.append(
        el("div", { class: "slot-bar" }, [
          el("span", { class: "slot-name", text: cam.name, title: cam.name + " · " + cam.area }),
          ...(sourceTag(cam) ? [el("span", { class: "src-tag", text: sourceTag(cam), title: "Frame grabbed through ffmpeg, not the NYCTMC list" })] : []),
          el("div", { class: "slot-actions" }, [watchBtn, assessBtn]),
          stateNode,
        ])
      );
      return node;
    })
  );
}

function renderFeed() {
  const host = $("feed");
  const items = store.activity.slice(0, 40);
  if (items.length === 0) {
    host.replaceChildren(
      el("p", { class: "entry" }, [el("span", { class: "when", text: "—" }), el("span", { class: "what", text: "Nothing has happened yet. Assess a frame to start the session." })])
    );
    return;
  }
  host.replaceChildren(
    ...items.map((item) =>
      el("div", { class: "entry" + (item.ok ? "" : " bad") }, [
        el("span", { class: "when", text: stamp(item.at) }),
        el("span", { class: "what", text: item.text }),
      ])
    )
  );
}

function renderHot() {
  const host = $("hot");
  const recent = store.recent(10).reverse();
  if (recent.length === 0) {
    host.replaceChildren(el("span", { class: "empty", text: "Nothing assessed yet." }));
    return;
  }
  host.replaceChildren(
    ...recent.map((cam) => {
      const r = store.results.get(cam.id);
      const btn = el("button", { type: "button", class: r && r.flagged ? "flag" : "", title: cam.name + ": " + (r.category ?? r.reason) });
      const img = el("img", { alt: cam.name, loading: "lazy" });
      img.src = cam.imageUrl + (cam.imageUrl.includes("?") ? "&" : "?") + "t=" + r.at;
      btn.append(img, el("span", { class: "tag", text: (r.category ?? "failed") }));
      btn.addEventListener("click", () => {
        store.setSelected(cam.id);
        store.assess(cam.id);
      });
      return btn;
    })
  );
}

function render() {
  renderWall();
  renderFeed();
  renderHot();
  map.set({
    cameras: store.viewCameras(),
    results: store.results,
    watch: store.watch,
    selected: store.selected,
    hotspots: store.hotspots,
  });
  for (const b of document.querySelectorAll(".inset-modes [data-mode]")) {
    b.setAttribute("aria-pressed", b.dataset.mode === store.mapMode ? "true" : "false");
  }
  $("fires-toggle").setAttribute("aria-pressed", store.hotspots.length > 0 ? "true" : "false");
  $("fires-toggle").title = store.firesError || "Active-fire hotspots from the local server";
  const src = $("source");
  src.textContent = store.source.note;
  src.className = "src " + (store.source.kind === "live" ? "" : store.source.kind === "offline" ? "warn" : "bad");

  const bulk = $("assess-watched");
  bulk.textContent = store.busy.size > 0 ? "Working…" : "Assess watched (" + store.watch.size + ")";
  bulk.disabled = store.watch.size === 0 || store.busy.size > 0;

  const crew = $("crew");
  if (store.crew) {
    const patrol = store.crew.patrol;
    crew.textContent = store.crewError
      ? "Crew: " + store.crewError
      : patrol
        ? "Crew: patrol " + (patrol.status ?? "running")
        : "Crew: no records yet";
    crew.style.color = "";
  } else if (store.crewError) {
    crew.textContent = "Crew: " + store.crewError;
    crew.style.color = "var(--flag)";
  }
}

let firesOn = false;
$("fires-toggle").addEventListener("click", async () => {
  if (!firesOn) {
    const r = await store.loadFires();
    firesOn = r.ok;
  } else {
    store.hotspots = [];
    store.firesError = null;
    firesOn = false;
    store.emit();
  }
});
for (const b of document.querySelectorAll(".inset-modes [data-mode]")) {
  b.addEventListener("click", () => store.setMapMode(b.dataset.mode));
}

const ops = createOps({ store, division, mount: $("ops-mount"), variant: "ignis" });
$("ops-open").addEventListener("click", () => ops.toggle("wall"));

// Same agent console the other two divisions carry, in the timeline's voice.
const agent = createAgent({ store, division, mount: $("agent") });

$("assess-watched").addEventListener("click", () => store.assessWatched());

$("map-toggle").addEventListener("click", () => {
  $("inset").classList.add("open");
  $("map-toggle").style.display = "none";
  map.draw();
});
$("map-close").addEventListener("click", () => {
  $("inset").classList.remove("open");
  $("map-toggle").style.display = "";
});

store.subscribe(render);
setInterval(() => {
  $("clock").textContent = clock();
}, 1000);
$("clock").textContent = clock();
setInterval(render, 15000);

async function boot() {
  render();
  agent.refreshHealth();
  await store.loadCameras();
  render();
  await store.loadHealth();
  await store.loadCrew();
  render();
}
boot();
</script>
</body>
</html>
