<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Medicus: EMS triage</title>
<style>
  /* Medicus is the board-first division. No dark console, no wall grid, no
     rail: a clinical sheet — cream paper, ink type, three lanes of cards, one
     search field. Red is kept for a flag and nothing else, the same way a
     triage tag uses it. Mono appears on timestamps only.

     The page owns this stylesheet. Vigiles and Ignis share its behaviour and
     none of its look. */

  /* ---- base ---- */
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #f4f1e8;
    color: #20241f;
    font-family: "Helvetica Neue", "Segoe UI", "DejaVu Sans", sans-serif;
    font-size: 13px;
    line-height: 1.45;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, h4, p, ul, ol { margin: 0; }
  ul, ol { padding: 0; list-style: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input, select { font: inherit; }
  :focus-visible { outline: 2px solid #b23a2f; outline-offset: 1px; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(32, 36, 31, 0.2); border-radius: 999px; border: 3px solid transparent; background-clip: content-box; }
  .mono { font-family: ui-monospace, "SF Mono", "DejaVu Sans Mono", monospace; }
  .dim { color: #5c6259; }
  .dimmer { color: #8b9088; }
  .fail { color: #b23a2f; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 5px 12px; border: 1px solid rgba(32, 36, 31, 0.28);
    border-radius: 999px; background: #fffdf7; color: #20241f;
    font-size: 11.5px; white-space: nowrap;
  }
  .btn:hover { border-color: #20241f; }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn.primary { background: #b23a2f; border-color: #b23a2f; color: #fff; }
  .btn.primary:hover { background: #9c3127; }
  .btn.ghost { background: transparent; }

  :root {
    --ink: #f4f1e8;
    --panel: #fffdf7;
    --raised: #ffffff;
    --line: rgba(32, 36, 31, 0.14);
    --line-strong: rgba(32, 36, 31, 0.3);
    --text: #20241f;
    --dim: #5c6259;
    --dimmer: #8b9088;
    --accent: #b23a2f;
    --accent-ink: #ffffff;
    --radius: 12px;
    --flag: #b23a2f;
    --ok: #2f6b4f;
  }
  body {
    display: grid; grid-template-rows: 64px 1fr 232px 30px; height: 100vh;
    background: #f4f1e8;
  }

  /* The ASCII loop on paper: the renderer's green palette multiplied into the
     sheet at low opacity. Cards, map and agent stay opaque so nothing moving
     sits under a reading. */
  #logo-background { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; opacity: 0.22; mix-blend-mode: multiply; pointer-events: none; }
  header.bar, main, section.band, footer.strip { position: relative; z-index: 1; }
  /* The triage lanes stop at their last card. Without this bar the bottom
     third of the screen was empty background, which read as a page that had
     not finished loading. The bar carries the crew and board state instead. */
  footer.strip {
    display: flex; align-items: center; gap: 18px; padding: 0 20px;
    border-top: 1px solid var(--line); font-size: 10.5px; color: var(--dimmer);
    font-family: var(--mono); min-width: 0;
  }
  footer.strip .grow { flex: 1; }
  footer.strip .k { color: var(--dim); text-transform: uppercase; letter-spacing: 0.1em; }
  footer.strip .bad { color: var(--flag); }

  header.bar {
    display: flex; align-items: center; gap: 16px; padding: 0 20px;
  }
  .brand { display: flex; align-items: baseline; gap: 8px; }
  .brand h1 {
    display: flex; align-items: center; gap: 7px;
    font-family: Georgia, "Times New Roman", serif; font-size: 20px; font-weight: 400;
    letter-spacing: -0.01em;
  }
  .brand h1 svg { color: var(--accent); }
  .ops-trigger {
    padding: 4px 13px; border: 1px solid var(--line-strong); border-radius: 999px;
    font-family: ui-monospace, monospace; font-size: 9.5px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--dim); background: #fffdf7;
  }
  .ops-trigger:hover { border-color: var(--accent); color: var(--accent); }
  .brand .dept {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--dimmer);
  }
  .searchwrap { position: relative; margin-left: 12px; }
  #search {
    width: 268px; padding: 8px 14px; border-radius: 999px;
    border: 1px solid var(--line-strong); background: #fffdf7;
    color: var(--text); font: inherit; font-size: 12px;
  }
  #search::placeholder { color: var(--dimmer); }
  #results {
    position: absolute; top: 38px; left: 0; width: 330px; z-index: 20;
    background: #fffdf7; border: 1px solid var(--line-strong); border-radius: 12px;
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.5); overflow: hidden; max-height: 320px;
    overflow-y: auto; display: none;
  }
  #results.open { display: block; }
  #results button {
    display: grid; grid-template-columns: 1fr auto; gap: 2px 8px;
    width: 100%; text-align: left; padding: 8px 12px; font-size: 12px;
    border-bottom: 1px solid var(--line);
  }
  #results button:last-child { border-bottom: 0; }
  #results button:hover { background: rgba(63, 168, 139, 0.14); }
  #results .area { font-family: var(--mono); font-size: 9.5px; color: var(--dimmer); }
  #results .add { color: var(--accent); font-family: var(--mono); font-size: 10px; align-self: center; }
  #results .none { padding: 12px; font-size: 11.5px; color: var(--dimmer); }

  .bar-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
  #source { font-family: var(--mono); font-size: 10.5px; color: var(--dim); max-width: 300px; text-align: right; line-height: 1.35; }
  #source.warn { color: #d8b45f; }
  #source.bad { color: #e7836b; }
  #clock { font-family: var(--mono); font-size: 11px; color: var(--dimmer); font-variant-numeric: tabular-nums; }

  main { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; padding: 0 18px 18px; min-height: 0; }

  /* Column rules run the full height so an empty board still reads as three
     triage columns rather than as a page with nothing on it. */
  .lane {
    display: grid; grid-template-rows: auto 1fr; min-height: 0;
    padding-left: 14px; border-left: 1px solid var(--line);
  }
  .lane:first-child { padding-left: 0; border-left: 0; }
  .lane-head { border-bottom: 1px solid var(--line); }
  .lane-head {
    display: flex; align-items: baseline; gap: 10px; padding: 6px 4px 10px;
  }
  .lane-head h2 { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
  .lane-head .n {
    font-family: var(--mono); font-size: 11px; color: var(--text);
    background: rgba(63, 168, 139, 0.16); border: 1px solid var(--line-strong);
    border-radius: 999px; padding: 0 8px;
  }
  .lane-head .hint { margin-left: auto; font-size: 10.5px; color: var(--dimmer); }
  .lane-body {
    overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 10px;
    padding: 2px 2px 12px;
  }
  .lane.immediate .lane-head h2 { color: #f0b49f; }
  .lane.immediate .lane-head .n { background: rgba(231, 131, 107, 0.16); }

  .card {
    border-radius: var(--radius); background: #fffdf7;
    border: 1px solid var(--line); overflow: hidden;
    box-shadow: 0 1px 0 rgba(32, 36, 31, 0.04);
    display: grid; grid-template-rows: auto auto;
    /* flex: none stops the lane from squeezing the card and hiding its
       caption row behind the snapshot. */
    flex: none;
  }
  .card.flag { border-color: rgba(231, 131, 107, 0.55); }
  .card .shot { position: relative; aspect-ratio: 16 / 9; background: #e7e3d8; border-bottom: 1px solid var(--line); }
  .card .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .shot .missing {
    display: grid; place-items: center; height: 100%; font-size: 10.5px; color: var(--dimmer);
    text-align: center; padding: 10px; font-family: var(--mono);
  }
  .card .body { padding: 10px 12px 12px; display: grid; gap: 5px; }
  .card .name { font-size: 12.5px; font-weight: 600; display: flex; align-items: baseline; gap: 8px; }
  .card .src-tag {
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--dim); border: 1px solid var(--line-strong);
    border-radius: 3px; padding: 0 4px; flex: none;
  }
  .card .line { font-size: 11.5px; color: var(--dim); line-height: 1.4; }
  .card .line.flag { color: #f0b49f; }
  .card .line.bad { color: #e7836b; }
  .card .foot { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
  .card .stamp { font-family: var(--mono); font-size: 10px; color: var(--dimmer); margin-left: auto; }
  .card .btn { border-radius: 999px; padding: 4px 10px; font-size: 11px; }
  .card .btn.primary { background: #b23a2f; border-color: #b23a2f; color: #fff; }
  .card .btn.primary:hover { background: #9c3127; }

  .lane .empty {
    border: 1px dashed var(--line-strong); border-radius: var(--radius);
    padding: 16px; font-size: 11.5px; color: var(--dimmer); line-height: 1.5;
  }

  /* Bottom band: the camera layer on the left, the duty agent on the right.
     Before this the triage columns floated over two thirds of empty screen. */
  .band {
    display: grid; grid-template-columns: minmax(0, 1fr) 470px; gap: 14px;
    padding: 0 18px 14px; min-height: 0;
  }
  .band-map {
    position: relative; border: 1px solid var(--line); border-radius: var(--radius);
    background: #efece1; overflow: hidden; min-height: 0;
  }
  #med-map { width: 100%; height: 100%; display: block; cursor: grab; }
  #med-map:active { cursor: grabbing; }
  .band-map .legend {
    position: absolute; left: 10px; top: 8px; display: flex; gap: 12px;
    font-family: var(--mono); font-size: 10px; color: var(--dimmer);
    background: rgba(5, 11, 10, 0.72); padding: 3px 8px; border-radius: 999px;
    pointer-events: none;
  }
  .band-map .legend .dot { color: var(--accent); }
  .band-map .legend .muted { color: rgba(180, 200, 230, 0.65); }

  .agent {
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: #fffdf7;
  }
  .agent-head {
    display: flex; align-items: baseline; gap: 10px; padding: 8px 12px;
    border-bottom: 1px solid var(--line);
  }
  .agent-head h2 { font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
  .agent-head .state { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--dimmer); }
  .agent-head .state.bad { color: var(--flag); }
  .agent-log { overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 7px; }
  .agent-log .turn { font-size: 11.5px; line-height: 1.5; max-width: 92%; }
  .agent-log .turn.user {
    align-self: flex-end; color: #20241f; background: #efece1;
    border: 1px solid var(--line-strong); border-radius: 12px 12px 3px 12px;
    padding: 6px 10px;
  }
  .agent-log .turn.agent { color: var(--text); border-left: 2px solid var(--accent); padding-left: 9px; }
  .agent-log .turn.note { color: var(--dimmer); font-family: var(--mono); font-size: 10.5px; }
  .agent-log .turn.bad { color: #9c3127; border-left: 2px solid var(--flag); padding-left: 9px; }
  .agent form { display: flex; gap: 8px; padding: 9px 12px; border-top: 1px solid var(--line); }
  .agent input {
    flex: 1; min-width: 0; background: #fffdf7; color: var(--text);
    border: 1px solid var(--line-strong); border-radius: 999px; padding: 7px 12px; font-size: 11.5px;
  }
  .agent input:focus { outline: 1px solid var(--accent); outline-offset: 1px; }
  .agent button { border-radius: 999px; padding: 7px 14px; font-size: 11.5px; }

  #toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 20px; z-index: 80;
    padding: 8px 16px; border-radius: 999px; background: #20241f;
    border: 1px solid #20241f; font-size: 11.5px; color: #fffdf7;
    opacity: 0; transition: opacity 160ms ease; pointer-events: none;
  }
  #toast.show { opacity: 1; }
  #toast.bad { border-color: rgba(231, 131, 107, 0.6); color: #f0b49f; }

  /* map modes: paper tabs over the camera sheet */
  .map-modes {
    position: absolute; right: 10px; top: 8px; display: flex; gap: 2px;
    background: #fffdf7; border: 1px solid var(--line-strong);
    border-radius: 999px; padding: 2px;
  }
  .map-modes button {
    padding: 2px 9px; border-radius: 999px; font-family: ui-monospace, monospace;
    font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim);
  }
  .map-modes button[aria-pressed="true"] { background: #20241f; color: #fffdf7; }

  /* ---- operations: a full clinical sheet, not a drawer ---- */
  .ops {
    position: fixed; inset: 16px; z-index: 50; display: grid;
    grid-template-rows: auto auto 1fr; background: #f4f1e8;
    border: 1px solid rgba(32, 36, 31, 0.35); border-radius: 4px;
    box-shadow: 0 24px 80px rgba(32, 36, 31, 0.28);
    opacity: 0; transform: translateY(6px); transition: opacity 140ms ease, transform 140ms ease;
  }
  .ops.open { opacity: 1; transform: none; }
  .ops[hidden] { display: none; }
  .ops-head { display: flex; align-items: flex-start; gap: 14px; padding: 18px 26px 12px; border-bottom: 2px solid #20241f; }
  .ops-title h2 { font-family: Georgia, "Times New Roman", serif; font-size: 30px; font-weight: 400; letter-spacing: -0.01em; }
  .ops-badge { display: block; margin-top: 2px; font-family: ui-monospace, monospace; font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dimmer); }
  .ops-head-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .ops-source { max-width: 300px; font-family: ui-monospace, monospace; font-size: 9.5px; color: var(--dim); text-align: right; }
  .ops-source.warn { color: #8a6a12; }
  .ops-source.bad { color: var(--accent); }
  .ops-close { display: grid; place-items: center; width: 28px; height: 28px; border: 1px solid var(--line-strong); border-radius: 999px; color: var(--dim); background: #fffdf7; }
  .ops-close:hover { color: var(--accent); border-color: var(--accent); }
  .ops-tabs { display: flex; gap: 4px; padding: 10px 26px 0; border-bottom: 1px solid var(--line); }
  .ops-tab {
    padding: 6px 14px 8px; border-radius: 999px 999px 0 0; font-size: 12px; color: var(--dim);
    border-bottom: 2px solid transparent;
  }
  .ops-tab:hover { color: var(--text); background: rgba(32, 36, 31, 0.05); }
  .ops-tab[aria-pressed="true"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  .ops-status { padding: 6px 26px; font-family: ui-monospace, monospace; font-size: 10px; color: var(--dim); }
  .ops-status:empty { display: none; }
  .ops-body { overflow-y: auto; padding: 16px 26px 30px; display: grid; gap: 16px; align-content: start; }
  .ops-note { font-size: 12px; color: var(--dim); line-height: 1.55; }
  .ops-note.muted { color: var(--dimmer); }
  .ops-note.bad { color: var(--accent); }
  .ops-note.ok { color: var(--ok); }
  .ops-block { background: #fffdf7; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; }
  .ops-block-head h3 { font-family: Georgia, serif; font-size: 17px; font-weight: 400; }
  .ops-hint { font-size: 11.5px; color: var(--dimmer); margin-top: 1px; }
  .ops-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .ops-row-between { justify-content: space-between; }
  .ops-btn { padding: 5px 13px; border: 1px solid var(--line-strong); border-radius: 999px; background: #fffdf7; color: var(--text); font-size: 11.5px; }
  .ops-btn:hover { border-color: #20241f; }
  .ops-btn.primary { background: #b23a2f; border-color: #b23a2f; color: #fff; }
  .ops-btn.ghost { background: transparent; }
  .ops-btn:disabled { opacity: 0.45; }
  .ops-input { width: 100%; padding: 7px 12px; background: #fffdf7; border: 1px solid var(--line-strong); border-radius: 999px; color: var(--text); font-size: 12px; }
  .ops-field { display: grid; gap: 3px; flex: 1 1 240px; font-family: ui-monospace, monospace; font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
  .ops-file { font-size: 11.5px; color: var(--dim); }
  .ops-video { width: 100%; max-height: 240px; background: #20241f; border-radius: 8px; object-fit: contain; }
  .ops-wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .ops-wall-card { background: #fffdf7; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: grid; }
  .ops-wall-img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #e7e3d8; }
  .ops-wall-missing { aspect-ratio: 16 / 9; display: grid; place-items: center; padding: 12px; font-size: 11px; color: var(--dimmer); }
  .ops-wall-body { padding: 10px 12px 12px; display: grid; gap: 4px; }
  .ops-wall-body h4 { font-family: Georgia, serif; font-size: 15px; font-weight: 400; }
  .ops-wall-area { font-family: ui-monospace, monospace; font-size: 9px; color: var(--dimmer); }
  .ops-wall-last { font-size: 11.5px; color: var(--dim); }
  .ops-wall-last.flag, .ops-wall-last.bad { color: var(--accent); }
  .ops-list { display: grid; border: 1px solid var(--line); border-radius: 12px; background: #fffdf7; overflow: hidden; }
  .ops-hist-row { display: grid; grid-template-columns: 92px 1fr 130px 110px; gap: 8px; padding: 7px 14px; text-align: left; font-size: 12px; border-top: 1px solid var(--line); }
  .ops-hist-row:first-child { border-top: 0; }
  .ops-hist-row:hover, .ops-hist-row.on { background: #efece1; }
  .ops-hist-time, .ops-hist-src { font-family: ui-monospace, monospace; font-size: 10px; color: var(--dimmer); }
  .ops-hist-cat { color: var(--dim); }
  .ops-hist-cat.flag, .ops-hist-cat.bad { color: var(--accent); }
  .ops-detail { background: #fffdf7; border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 8px; }
  .ops-detail:empty { display: none; }
  .ops-cat { font-family: Georgia, serif; font-size: 20px; }
  .ops-cat.flag, .ops-cat.bad { color: var(--accent); }
  .ops-sum { font-size: 12.5px; color: var(--dim); }
  .ops-meta { font-family: ui-monospace, monospace; font-size: 10px; color: var(--dimmer); }
  .ops-steps { display: grid; gap: 3px; font-size: 11.5px; }
  .ops-steps .done { color: var(--ok); }
  .ops-steps .miss { color: var(--dimmer); }
  .ops-metrics { display: flex; flex-wrap: wrap; gap: 30px; padding: 4px 0; }
  .ops-metric { display: grid; }
  .ops-metric-v { font-family: Georgia, serif; font-size: 30px; font-variant-numeric: tabular-nums; }
  .ops-metric-k { font-family: ui-monospace, monospace; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
  .ops-metric-h { font-size: 10.5px; color: var(--dimmer); }
  .ops-table { display: grid; font-size: 12px; }
  .ops-tr { display: grid; grid-template-columns: 1fr 80px 120px; gap: 8px; padding: 4px 0; border-top: 1px solid var(--line); }
  .ops-tr span:not(:first-child) { text-align: right; font-variant-numeric: tabular-nums; }
  .ops-thead { color: var(--dimmer); font-family: ui-monospace, monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; border-top: 0; }
  .ops-kvlist { background: #fffdf7; border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; display: grid; gap: 4px; }
  .ops-kv { display: grid; grid-template-columns: 150px 1fr; gap: 10px; font-size: 12px; padding: 3px 0; border-top: 1px solid var(--line); }
  .ops-kv:first-child { border-top: 0; }
  .ops-k { font-family: ui-monospace, monospace; font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); }
  .ops-kv.bad .ops-v { color: var(--accent); }
  .ops-search { position: fixed; inset: 0; z-index: 70; background: rgba(32, 36, 31, 0.4); display: grid; place-items: start center; padding-top: 12vh; }
  .ops-search[hidden] { display: none; }
  .ops-search-box { width: min(620px, 92vw); background: #f4f1e8; border: 1px solid rgba(32, 36, 31, 0.4); border-radius: 4px; padding: 20px; display: grid; gap: 12px; box-shadow: 0 24px 60px rgba(32, 36, 31, 0.3); }
  .ops-search-label { font-family: ui-monospace, monospace; font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
  .ops-search-input { width: 100%; padding: 9px 14px; background: #fffdf7; border: 1px solid var(--line-strong); border-radius: 999px; color: var(--text); }
  .ops-search-results { display: grid; max-height: 46vh; overflow-y: auto; }
  .ops-search-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 4px; border-top: 1px solid var(--line); text-align: left; font-size: 13px; }
  .ops-search-row:hover { background: #efece1; }
  .ops-search-meta { font-family: ui-monospace, monospace; font-size: 10px; color: var(--dimmer); }
  .ops-help { display: grid; gap: 5px; font-size: 13px; }

  @media (max-width: 1080px) {
    main { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 0 12px 12px; }
    #search { width: 190px; }
    .ops { inset: 8px; }
    .ops-hist-row { grid-template-columns: 78px 1fr 100px; }
    .ops-hist-src { display: none; }
  }
</style>
</head>
<body data-product="medicus">
<canvas id="logo-background" aria-hidden="true"></canvas>
<header class="bar">
  <div class="brand">
    <h1>
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M6.4 1.5h3.2v4.9h4.9v3.2h-4.9v4.9H6.4v-4.9H1.5V6.4h4.9V1.5Z" fill="currentColor"/></svg>
      Medicus
    </h1>
    <p class="dept">Meta OS / EMS</p>
  </div>
  <div class="searchwrap">
    <input id="search" type="search" placeholder="Add a camera: name or borough" autocomplete="off" aria-label="Search cameras">
    <div id="results" role="listbox" aria-label="Camera search results"></div>
  </div>
  <div class="bar-right">
    <button id="ops-open" class="ops-trigger" type="button" aria-haspopup="dialog">Operations</button>
    <p id="source">Loading the camera list.</p>
    <button id="assess-all" class="btn primary" type="button">Assess watched</button>
    <p id="clock">--:--:--</p>
  </div>
</header>

<main>
  <section class="lane immediate">
    <div class="lane-head"><h2>Immediate</h2><span class="n" id="n-immediate">0</span><span class="hint">assessment asked for a human look</span></div>
    <div class="lane-body" id="lane-immediate"></div>
  </section>
  <section class="lane delayed">
    <div class="lane-head"><h2>Delayed</h2><span class="n" id="n-delayed">0</span><span class="hint">assessed, no flag raised</span></div>
    <div class="lane-body" id="lane-delayed"></div>
  </section>
  <section class="lane unseen">
    <div class="lane-head"><h2>Unseen</h2><span class="n" id="n-unseen">0</span><span class="hint">watched, no successful assessment yet</span></div>
    <div class="lane-body" id="lane-unseen"></div>
  </section>
</main>

<section class="band">
  <div class="band-map">
    <canvas id="med-map" aria-label="Camera layer: every NYC DOT camera, watched cameras highlighted"></canvas>
    <p class="legend"><span class="dot">&#9679; watched <span id="legend-watched">0</span></span><span class="muted">&#9679; camera</span><span>drag to pan, scroll to zoom</span></p>
    <div class="map-modes" role="group" aria-label="Map mode and layers">
      <button type="button" data-mode="city" aria-pressed="true">City</button>
      <button type="button" data-mode="tactical" aria-pressed="false">Tactical</button>
      <button type="button" data-mode="incident" aria-pressed="false">Incident</button>
      <button type="button" data-mode="focus" aria-pressed="false">Focus</button>
      <button type="button" id="fires-toggle" aria-pressed="false">Fires</button>
    </div>
  </div>
  <aside id="agent" class="agent"></aside>
</section>

<footer class="strip">
  <span><span class="k">Crew</span> <span id="crew">reading…</span></span>
  <span><span class="k">Board</span> <span id="board">0 / 6</span></span>
</footer>

<p id="toast" role="status"></p>

<div id="ops-mount"></div>

<script src="../js/logo-background.js"></script>
<script type="module">
import { createStore, LocalMap, clock, ago, el, sourceTag, DIVISIONS, MAX_WATCHED } from "./core.js";
import { createOps } from "./ops.js";
import { createAgent } from "./agent.js";

const division = DIVISIONS.ems;
const store = createStore("ems");
const $ = (id) => document.getElementById(id);
let toastTimer = null;

function toast(text, bad = false) {
  const node = $("toast");
  node.textContent = text;
  node.className = "show" + (bad ? " bad" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    node.className = "";
  }, 3200);
}

function card(cam) {
  const r = store.results.get(cam.id);
  const busy = store.busy.has(cam.id);
  const node = el("article", { class: "card" + (r && r.flagged ? " flag" : "") });

  const shot = el("div", { class: "shot" });
  const img = el("img", { alt: "Snapshot of " + cam.name, loading: "lazy" });
  img.src = cam.imageUrl + (cam.imageUrl.includes("?") ? "&" : "?") + "t=" + Date.now();
  img.addEventListener("error", () => {
    shot.replaceChildren(el("div", { class: "missing", text: "No snapshot. The camera host did not answer." }));
  });
  shot.append(img);

  const line = !r
    ? el("p", { class: "line", text: "Watched, not assessed. " + cam.area + "." })
    : r.status === "failed"
      ? el("p", { class: "line bad", text: r.reason })
      : el("p", { class: "line" + (r.flagged ? " flag" : ""), text: r.category + (r.summary ? ". " + r.summary : "") });

  const watch = el("button", { class: "btn", type: "button", text: "Remove" });
  watch.addEventListener("click", () => store.toggleWatch(cam.id));

  const assess = el("button", {
    class: "btn primary",
    type: "button",
    text: busy ? "Assessing" : "Assess",
  });
  assess.disabled = busy;
  assess.addEventListener("click", () => store.assess(cam.id));

  node.append(
    shot,
    el("div", { class: "body" }, [
      el("p", { class: "name" }, [
        el("span", { text: cam.name }),
        ...(sourceTag(cam) ? [el("span", { class: "src-tag", text: sourceTag(cam) })] : []),
      ]),
      line,
      el("div", { class: "foot" }, [
        assess,
        watch,
        el("span", { class: "stamp", text: r ? ago(r.at) : "new" }),
      ]),
    ])
  );
  return node;
}

function lane(hostId, countId, cameras, emptyText) {
  const host = $(hostId);
  $(countId).textContent = String(cameras.length);
  if (cameras.length === 0) {
    host.replaceChildren(el("p", { class: "empty", text: emptyText }));
    return;
  }
  host.replaceChildren(...cameras.map(card));
}

function render() {
  const watched = [...store.watch].map((id) => store.byId.get(id)).filter(Boolean);
  const immediate = watched.filter((c) => {
    const r = store.results.get(c.id);
    return r && r.status === "ok" && r.flagged;
  });
  const delayed = watched.filter((c) => {
    const r = store.results.get(c.id);
    return r && r.status === "ok" && !r.flagged;
  });
  // A failed assessment is not a priority signal, so it stays in Unseen where
  // its card shows the failure in red. Moving it to Delayed would read as
  // "assessed, nothing to see", which is the opposite of what happened.
  const unseen = watched.filter((c) => {
    const r = store.results.get(c.id);
    return !r || r.status !== "ok";
  });

  lane("lane-immediate", "n-immediate", immediate,
    "Nothing needs a human look. Flags land here when an assessment asks for one.");
  lane("lane-delayed", "n-delayed", delayed,
    "Nothing assessed without a flag yet.");
  lane("lane-unseen", "n-unseen", unseen,
    watched.length >= MAX_WATCHED
      ? "Watch list is full at " + MAX_WATCHED + ". Remove a card to add another camera."
      : "Nothing waiting. Add a camera from the search field. The board holds " + MAX_WATCHED + " cameras.");

  // First run has an empty board, and an empty board teaches nothing. One
  // button fills it with six real cameras from the list already loaded. It is
  // a click, not a hidden default, so the board never pretends the operator
  // chose those cameras.
  if (watched.length === 0 && store.cameras.length > 0) {
    const start = el("button", { class: "btn primary", type: "button", text: "Fill the board with six cameras" });
    start.addEventListener("click", () => {
      for (const cam of store.cameras.slice(0, MAX_WATCHED)) store.toggleWatch(cam.id);
      toast("Added " + Math.min(MAX_WATCHED, store.cameras.length) + " cameras to the board.");
    });
    $("lane-unseen").append(start);
  }

  const src = $("source");
  src.textContent = store.source.note;
  src.className = store.source.kind === "live" ? "" : store.source.kind === "offline" ? "warn" : "bad";

  const all = $("assess-all");
  all.disabled = watched.length === 0 || store.busy.size > 0;
  all.textContent = store.busy.size > 0 ? "Working" : "Assess watched";

  $("board").textContent = watched.length + " / " + MAX_WATCHED;
  const crew = $("crew");
  if (store.crew) {
    const patrol = store.crew.patrol;
    crew.textContent = store.crewError
      ? store.crewError
      : patrol
        ? "patrol " + (patrol.status ?? "running")
        : "no records yet";
    crew.className = store.crewError ? "bad" : "";
  } else if (store.crewError) {
    crew.textContent = store.crewError;
    crew.className = "bad";
  }
  drawMap();
}

function renderResults() {
  const box = $("results");
  const q = $("search").value.trim();
  box.classList.toggle("open", q.length > 0);
  if (!q) {
    box.replaceChildren();
    return;
  }
  const matches = store.filter(q).slice(0, 24);
  if (matches.length === 0) {
    box.replaceChildren(el("p", { class: "none", text: "No camera matches that filter." }));
    return;
  }
  box.replaceChildren(
    ...matches.map((cam) => {
      const btn = el("button", { type: "button", role: "option" }, [
        el("span", {}, [
          el("span", { text: cam.name }),
          ...(sourceTag(cam) ? [el("span", { class: "src-tag", text: sourceTag(cam) })] : []),
        ]),
        el("span", { class: "add", text: store.watch.has(cam.id) ? "watching" : "add" }),
        el("span", { class: "area", text: cam.area }),
      ]);
      btn.addEventListener("click", () => {
        const res = store.toggleWatch(cam.id);
        if (!res.ok) toast(res.reason, true);
        $("search").value = "";
        $("results").classList.remove("open");
      });
      return btn;
    })
  );
}

$("search").addEventListener("input", renderResults);
$("search").addEventListener("blur", () => {
  setTimeout(() => $("results").classList.remove("open"), 150);
});
$("assess-all").addEventListener("click", async () => {
  const res = await store.assessWatched();
  if (!res.ok) toast(res.reason, true);
  else toast("Assessed " + res.results.length + " watched cameras.");
});

// Camera layer. Same canvas map as Vigiles and Ignis, so Medicus can see
// where the watched cameras are instead of only reading their names.
const medMap = LocalMap($("med-map"), {
  accent: "#35E0A1",
  zoom: 10.3,
  onSelect: (id) => {
    const cam = store.byId.get(id);
    if (!cam) return;
    medMap.set({ selected: id });
    toast(cam.name + " · " + cam.area + (store.watch.has(id) ? " · watched" : " · press the card to watch"));
  },
});

function drawMap() {
  $("legend-watched").textContent = String(store.watch.size);
  medMap.set({
    cameras: store.viewCameras(),
    results: store.results,
    watch: store.watch,
    hotspots: store.hotspots,
  });
  for (const b of document.querySelectorAll(".map-modes [data-mode]")) {
    b.setAttribute("aria-pressed", b.dataset.mode === store.mapMode ? "true" : "false");
  }
  $("fires-toggle").setAttribute("aria-pressed", store.hotspots.length > 0 ? "true" : "false");
  $("fires-toggle").title = store.firesError || "Active-fire hotspots from the local server";
}

// Duty agent. Same console as Vigiles and Ignis, drawn in this sheet's own
// paper and pill language by the CSS above.
const agent = createAgent({
  store,
  division,
  mount: $("agent"),
  title: "Agent",
  placeholder: "Ask the duty agent about this board",
});

let firesOn = false;
$("fires-toggle").addEventListener("click", async () => {
  if (!firesOn) {
    const r = await store.loadFires();
    firesOn = r.ok;
  } else {
    store.hotspots = [];
    store.firesError = null;
    firesOn = false;
    store.emit();
  }
});
for (const b of document.querySelectorAll(".map-modes [data-mode]")) {
  b.addEventListener("click", () => store.setMapMode(b.dataset.mode));
}

const ops = createOps({ store, division, mount: $("ops-mount"), variant: "medicus" });
$("ops-open").addEventListener("click", () => ops.toggle("wall"));

store.subscribe(render);
setInterval(() => {
  $("clock").textContent = clock();
}, 1000);
$("clock").textContent = clock();
setInterval(render, 15000);

async function boot() {
  render();
  agent.refreshHealth();
  await store.loadCameras();
  // ?seed=6 fills the board for a screenshot or a demo. Nothing else uses it.
  const seed = Number(new URLSearchParams(location.search).get("seed") || 0);
  if (seed > 0) for (const cam of store.cameras.slice(0, Math.min(MAX_WATCHED, seed))) store.toggleWatch(cam.id);
  render();
  await store.loadHealth();
  await store.loadCrew();
  render();
}
boot();
</script>
</body>
</html>
